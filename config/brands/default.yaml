id: default
display_name: buddha.realteachings
default_profile_id: rational_thoughts
default_format_id: reel
default_platform_id: instagram
voice:
  traits: []
  avoid: []
template:
  # quote_painting: Gemini paints the background art, then the exact copy is
  # overlaid on the left. Use "classic" for a text-only card (no image cost).
  layout: quote_painting
  background: "#F3E6CF"
  text: "#2B1D14"
  accent: "#8E1F1B"
  font_family: "Georgia, 'Times New Roman', serif"
  handle: "@buddha.realteachings"  # footer text on rendered images
  art_style: >-
    Warm painterly illustration in a classical style on aged cream
    parchment. Soft golden-hour light,
    muted ochre, saffron, terracotta and sepia tones, gentle brush texture,
    serene and contemplative mood, high detail on the figure, soft vignette.
