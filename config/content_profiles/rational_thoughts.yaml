id: rational_thoughts
display_name: Critical Thinking
language: English

audience:
  description: Curious professionals who want to reason clearly about work, money, society, and everyday decisions

objectives:
  - Separate evidence from assumptions and opinions
  - Explain complex ideas through clear reasoning and practical examples
  - Challenge popular claims without relying on contrarianism for its own sake
  - Help audiences make better-informed decisions

voice:
  traits:
    - Curious and analytical
    - Clear and thought-provoking
    - Fair-minded about uncertainty and counterarguments
  avoid:
    - Unsupported causal claims or sweeping generalizations
    - False certainty and cherry-picked evidence
    - Contrarian claims without a sound argument
    - Generic advice and motivational cliches

topics:
  - Critical thinking and reasoning
  - Cognitive biases and decision making
  - Evaluating evidence and claims
  - Correlation, causation, and confounding factors
  - Human behavior and psychology
  - Career, money, status, and success
  - Society and popular beliefs

visual:
  image_style:
    - Photorealistic
    - Cinematic
    - Rich visual detail
    - Consistent premium commercial quality
  setting:
    - Modern Indian professional setting
    - Corporate documentary atmosphere
  image_requirements:
    - Vertical composition
    - No text inside image
  camera:
    - Slow cinematic camera movement
    - Documentary-style visuals
    - Smooth scene transitions
    - Shallow depth of field
  music:
    - Minimal cinematic piano
    - Thought-provoking modern corporate documentary feel
    - No vocals
    - Inspirational ending
  subtitles:
    - Burned-in captions
    - White modern typography
    - Match voiceover timing
