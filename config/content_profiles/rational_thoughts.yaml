id: rational_thoughts
display_name: Buddha's Teachings
language: Simple, everyday English that a 12-year-old or a second-language reader understands on the first read

audience:
  description: Buddhists of every tradition worldwide, and anyone drawn to the Buddha's teaching, meditation, and mindfulness, who want real, sourced teachings they can practise in daily life

objectives:
  - Share the Buddha's real teachings accurately, with sources, in a warm and practical way
  - Help viewers apply one teaching to their own life today (overthinking, anger, grief, comparison, fear)
  - Respect every Buddhist tradition (Theravada, Mahayana, Zen, Tibetan) and label which tradition a teaching comes from
  - Gently correct fake or misattributed "Buddha quotes" without mocking anyone's faith

voice:
  traits:
    - Warm, calm, and compassionate
    - Clear, simple, and practical
    - Accurate and sourced, in the Buddha's own "come and see" spirit
    - Respectful of devotion and of every tradition
    - Warm and personal, speaking to the viewer as "you" about situations they actually live
    - Shareable, writing lines someone would send to a friend or loved one who needs them
  avoid:
    - Invented or misattributed quotations
    - Mocking or belittling beliefs, devotion, rituals, or any tradition
    - Exaggerated promises about enlightenment, health, wealth, or success
    - Preachiness, guilt, and moralising
    - Generic motivational cliches presented as Buddhist teaching
    - Abstract, academic, or fancy words (paradox, universal, perspective, orientation) when an everyday word works
    - Long sentences; keep each to one idea

topics:
  - The Four Noble Truths and the Noble Eightfold Path in daily life
  - Impermanence, non-self, and letting go
  - Mind training, mindfulness, and meditation
  - Anger, fear, grief, and overthinking
  - Loving-kindness, compassion, joy, and equanimity
  - Right speech, generosity, gratitude, and good friendship
  - Stories and parables from the Buddha's life and the Jatakas
  - Teachings from later traditions (Zen, Mahayana, Tibetan), clearly labelled

visual:
  image_style:
    - Striking, realistic imagery (cinematic film stills, museum-grade statue photography, or high-end 3D renders) chosen per post
    - Clear visual metaphors for evidence, belief, uncertainty, and perspective
    - One dominant light source and a deliberate color grade per image
  setting:
    - Everyday human and cultural contexts rather than default corporate scenes
    - Respectful, non-caricatured treatment of philosophical and secular themes
  image_requirements:
    - Vertical composition
    - No text inside image
  camera:
    - Purposeful, readable framing that supports the argument
    - Use close details or visual contrasts to clarify an idea
    - Dramatic but purposeful light; never spectacle that contradicts the point
  music:
    - Subtle, reflective instrumental bed
    - No vocals
    - Avoid forced inspirational endings
  subtitles:
    - Burned-in captions
    - High-contrast, readable typography
    - Match voiceover timing

# Applied to every post: thinkers are voices to examine, not authorities.
critical_lens:
  - Present teachings the way the Buddha invited, as practices to test in one's own life (Kalama Sutta), not as dogma.
  - Give the viewer one concrete way to practise or reflect on the teaching today.
  - Quote only verified wording, name the source, and label the tradition (early Buddhism, Mahayana, Zen, Tibetan).
  - Correct fake "Buddha quotes" gently and kindly; never mock beliefs, devotion, or practitioners.
  - Stay honest and humble; no exaggerated promises about enlightenment, health, or wealth.

# The page focuses on the Buddha; other thinkers stay available when chosen.
focus_thinkers:
  - buddha

# Story Reels: one real idea from one thinker, told in a selected story mode.
subtype_label: Story mode
reel_duration_seconds:
  minimum: 30
  maximum: 60

subtypes:
  - id: parable
    default_visual_style: 3d_render
    name: Modern Parable
    definition: Retell a classic story or teaching as a short modern-day scene with a clear turn and takeaway.
    structure: Hook with a relatable modern situation; the thinker's idea arrives through action, not lecture; quiet twist; one-line takeaway.
    background: Warm cinematic light, grounded everyday setting that transitions to the thinker's era for the key moment; soft acoustic or sitar-like bed.
    example: The mustard seed story retold in a hospital waiting room.
  - id: comedy
    default_visual_style: cinematic_photo
    name: Witty Comedy
    definition: Idea-driven humor where the joke lands on human behavior and irrational habits, never on the thinker or on believers.
    structure: Instant absurd premise; escalate through the habit the idea exposes; the thinker's calm logic is the punchline; short reflective button.
    background: Bright, slightly exaggerated colors and clean framing; playful pizzicato or light percussion with a comic pause before the punchline.
    example: Diogenes reviewing a self-help influencer's morning routine.
  - id: thoughtful
    default_visual_style: living_thinker
    name: Thoughtful Reflection
    definition: A calm, reflective story that leaves one line the viewer will remember.
    structure: Gentle hook image; a small human moment; the idea reframes it; end on a still, memorable line.
    background: Slow, painterly visuals with golden-hour or candle light, mist, water, or open landscapes; ambient pads or soft flute, no vocals.
    example: A student keeps a grudge like a hot coal and finally notices who is getting burned.
  - id: thought_provoking
    default_visual_style: cinematic_photo
    name: Thought-Provoking Dilemma
    definition: A puzzle, paradox, or dilemma that ends on an open question inviting comments.
    structure: Pose the dilemma in the first two seconds; show two tempting answers; the thinker's tool reframes it; end on a direct question to the viewer.
    background: High-contrast, moody lighting and symbolic split compositions; low pulsing drone that builds tension and cuts to silence on the final question.
    example: Socrates asks a confident commenter how they would know if they were wrong.
  - id: time_traveler
    default_visual_style: cinematic_photo
    name: Thinker in Today's World
    definition: The thinker encounters a modern situation and examines it with their own method.
    structure: Fish-out-of-water hook; the modern claim or habit; the thinker applies their method; the modern person's realization; light closing beat.
    background: Era-accurate figure contrasted against vivid modern settings such as phones, malls, or city streets; music blends an ancient instrument with a modern beat.
    example: The Buddha applies the Kalama Sutta to a viral WhatsApp forward.
  - id: myth_buster
    default_visual_style: thinker_statue
    name: Myth Buster
    definition: A popular quote or claim attributed to the Buddha is gently checked against what the texts actually say, then the real teaching is shared.
    structure: Show the viral quote; ask where it comes from; reveal the source or its absence; present the real idea; invite viewers to check sources.
    background: Clean documentary look with paper, manuscript, and archive textures and stamp or highlight effects; steady investigative beat.
    example: "Did the Buddha really say 'Holding on to anger is like drinking poison'?"
  - id: mirror
    default_visual_style: golden_light
    name: Mirror (Personal Truth)
    definition: A short, warm truth spoken to the viewer about something they feel (overthinking, conflict, comparison, setbacks, loneliness, people-pleasing), grounded in a thinker's idea and worth sending to someone you care about.
    structure: Title names who it is for (for example "For the overthinker"); Main_point is one second-person line of at most 12 words, often a paradox, contrast, or permission; Supporting_copy is a small credit such as "— Seneca" for a verified quote or "— inspired by Epictetus" for a paraphrase; the caption adds one honest nuance and invites sharing.
    background: An intimate, relatable everyday scene or a quiet symbolic image with one warm light; soft piano, flute, or lo-fi bed.
    example: '"Not every opinion needs your reply." — inspired by Epictetus, with a caption that notes when replying does matter.'
  - id: one_liner
    default_visual_style: golden_light
    name: One-Liner (Life Lesson)
    definition: One short, simple line that carries a deep life lesson from the teaching, easy enough for anyone to understand on the first read and true enough to remember for years.
    structure: Title is a 2-4 word plain hook; Main_point is the one-liner itself, at most 10 simple words, a whole life lesson in everyday language (a contrast or a turn works best); Supporting_copy is a small credit such as "— inspired by the Buddha" with the source; the caption explains the lesson in two or three short, plain sentences with one real-life example, then names the teaching and source.
    background: One calm, open image with a single warm light and lots of empty sky, so the line stands alone; soft flute or a gentle drone.
    example: '"You don''t lose what you let go. You lose what you hold too tight." — inspired by the Buddha, with a caption about a friendship that ended because one person held on too hard.'
  - id: dialogue
    default_visual_style: narrative_painting
    name: Dialogue (Buddha and young monk)
    definition: A two-line conversation between the Buddha and a young monk, in plain words, where the Buddha answers with a question or one line of wisdom that turns the young monk's thinking around.
    structure: >-
      Title is a 2-4 word plain hook naming the struggle (for example "When
      anger stays"); Main_point is the young monk's line, written as
      'Young monk: "..."', at most 10 simple words, usually a question about a
      feeling people live with; Supporting_copy is the Buddha's reply,
      written as 'Buddha: "..."', at most 10 simple words, a question back
      or a short life lesson with a turn. Prefer a real exchange from the
      suttas (for example Ananda on good friendship, SN 45.2, or Kisa Gotami
      and the mustard seed), kept close to the text and cited; use a real
      disciple's name (for example Ananda) only for a real exchange,
      otherwise write "Young monk".
      Never present an invented line as the Buddha's exact words; the
      caption says "A retelling inspired by" the teaching and gives its
      source, then one plain sentence on how to use it today.
    background: One quiet story moment with the Buddha and one young monk, the young monk looking up or bowing and the Buddha calm and kind, in a forest grove, a riverbank, or by lamplight; soft flute or a slow drone.
    example: 'Young monk: "Why does my anger keep coming back?" Buddha: "Because you keep feeding it." Caption: a retelling inspired by the Buddha''s teaching on anger (Dhammapada 3-5).'
  - id: mind_states
    default_visual_style: illustrated_watercolor
    designed_image: true
    name: Mind States (illustrated)
    definition: Three or four parallel plain-English lines that each name a state of mind and say where the mind is, ending on peace; one small drawing of a monk beside each line shows that state.
    structure: >-
      Title is an optional short headline such as "Where is your mind?"
      (2-5 words); Main_point holds three or four lines, one per line, each
      in the same pattern, with the state word bold, for example
      "**Worry** is when the mind lives in the future."; the last line is
      the calm one (peace, joy, or freedom). Supporting_copy is one short
      closing line or "— inspired by the Buddha". Each line is at most 10
      simple words. The caption explains each state in one plain line,
      names the teaching and source (for example the Bhaddekaratta Sutta,
      MN 131, on living in the present), and asks which one the viewer
      feels today.
    background: Cream paper page with one small watercolor monk beside each line (head in hands for stress, looking back for regret, gazing at a winding road for worry, sitting at peace in soft light); soft flute.
    example: '"**Regret** is when the mind is stuck in the past." / "**Worry** is when the mind runs to the future." / "**Peace** is when the mind is here."'
  - id: numbered_list
    default_visual_style: illustrated_watercolor
    designed_image: true
    name: Numbered List (illustrated)
    definition: A headline and six to nine short numbered points about everyday life (people, habits, peace of mind), each with a small drawing, in the spirit of a teaching.
    structure: >-
      Title is the headline ending with a colon, for example "Signs of a
      good friend:" (2-6 words); Main_point holds six to nine numbered
      lines, one per line, such as "1. They listen without judging", each
      at most 6 simple words; Supporting_copy is one short closing line
      such as "Keep these people close." The caption expands each point in
      one plain sentence, then ties the list to a teaching with its source
      (for example the Sigalovada Sutta, DN 31, on true friends) and asks
      viewers to tag someone.
    background: A neat grid of small watercolor vignettes of monks acting out each point, with each numbered point lettered under its drawing; calm acoustic bed.
    example: '"Signs of a good friend:" 1. They help when you are weak. 2. They keep your secrets. 3. They stay in hard times. (DN 31)'
  - id: illustrated_metaphor
    default_visual_style: illustrated_watercolor
    designed_image: true
    name: Illustrated Metaphor (speech bubbles)
    definition: A big plain-English headline with one illustrated scene that shows it, often the Buddha or a monk walking calmly past people whose words appear in speech bubbles.
    structure: >-
      Title is the headline, one plain sentence of at most 16 words that is
      the lesson (for example "You don't have to answer every voice that
      shouts at you."); Main_point holds three to five short labels, one per
      line, that appear in the speech bubbles (one to three words each, for
      example "Lazy", "Too quiet", "Not enough"); Supporting_copy is a short
      credit such as "— inspired by the Buddha". The caption explains the
      lesson in two plain sentences, gives the teaching and source (for
      example the Buddha's reply to the abusive Brahmin, SN 7.2), and asks
      a question.
    background: A calm figure walking or sitting at peace on one side while several people lean in shouting from the other, each with a speech bubble; warm watercolor on cream or soft pink paper; gentle music.
    example: Headline "Not every opinion of you is yours to carry." with bubbles "Weak", "Too soft", "Strange".
  - id: parable_card
    default_visual_style: cinematic_photo
    designed_image: true
    name: Parable Card ("A young monk asked the Buddha")
    definition: A short story told in three lines over a warm, cinematic scene, where the Buddha gives a simple, beautiful answer to a young monk's big question.
    structure: >-
      The words must match who is in the picture. Title is the opener naming
      both people, for example "A young monk asked the Buddha," (at most 7
      words); Main_point is the question in quotes, at most 6 words, for
      example "What is anger?" (with the quote marks); Supporting_copy is the
      answer with a lead-in that names the speaker, at most 20 simple words,
      for example The Buddha answered: "It is a punishment we give ourselves
      for someone else's mistake." Never write "A monk was asked" or "He
      answered" when the Buddha is the one answering. The answer must come
      from the Buddha's own teachings in the suttas or Dhammapada; never put a
      later teacher's words (Shantideva, Zen masters, modern authors) in the
      Buddha's mouth. The Design_prompt shows
      exactly these two people: the Buddha and one young monk. The caption
      labels the story honestly ("A short story inspired by" the teaching,
      with its source) and gives one plain way to use it today.
    background: A warm, cinematic photo of the Buddha and a young monk talking by lotus water or in a forest with soft god rays, with a calm, darker area in the lower third for the words; slow flute.
    example: 'A young monk asked the Buddha, "What is peace?" The Buddha answered: "Wanting nothing from this moment."'
  - id: real_or_fake
    default_visual_style: thinker_statue
    name: Real or Fake? (quote quiz)
    definition: A popular quote shown with the question "Real or fake?"; viewers guess in the comments, and the answer with its source comes in the first comment.
    structure: >-
      Title is "Real or fake?"; Main_point is one popular quote in quotation
      marks, at most 16 words, either a real line from the texts (cite it in
      the answer) or a famous misattribution; Supporting_copy is "Did the
      Buddha say this? Guess in the comments." The caption must not give the
      answer: hook line, one line on why checking sources matters, "Answer in
      the first comment.", then the hashtags. Put the answer on its own last
      line of the caption starting with "Answer:" (it is moved to the first
      comment), for example "Answer: Fake. It comes from a 2000s self-help
      book; the closest real teaching is Dhammapada 5."
    background: A calm museum-like portrait or statue scene with a question-like mood (half in light, half in shadow); a slow, curious music bed.
    example: '"Holding on to anger is like drinking poison and expecting the other person to die." Answer: Fake (modern saying); the real teaching on anger is Dhammapada 3-5.'
  - id: verified_quote
    default_visual_style: thinker_statue
    name: Verified Quote
    definition: One exact, sourced quote from the thinker, followed by a critical-thinking test of it.
    structure: Title is a short hook such as "Test this"; Main_point is the exact quote in quotation marks; Supporting_copy is the attribution and source; the caption explains the idea, gives one way to test or apply it, and names a limit or counterpoint.
    background: A dignified portrait or symbolic scene matching the thinker's era; calm, high-contrast light; a slow, thoughtful music bed.
    example: Epictetus on how our judgments, not events, disturb us, followed by a ten-second test the viewer can try today.

thinkers:
  - id: buddha
    name: The Buddha (Siddhartha Gautama)
    era: c. 5th century BCE, northern India
    core_ideas:
      # Framework
      - Life involves dissatisfaction (dukkha), it has a cause, it can end, and there is a path (Four Noble Truths, SN 56.11)
      - A practical path of right view, intention, speech, action, livelihood, effort, mindfulness, and concentration (Noble Eightfold Path, SN 56.11)
      - The middle way between indulgence and harsh self-denial (SN 56.11)
      - Everything conditioned is impermanent (Dhammapada 277)
      - No fixed, unchanging self can be found in body or mind (Anattalakkhana Sutta, SN 22.59)
      - Things arise from causes and conditions, not by fate or chance (dependent origination, SN 12.2)
      - Karma is intention; what shapes us is the intent behind our actions, not luck or ritual (AN 6.63)
      # Questioning and wisdom
      - Test teachings yourself instead of accepting them on authority or tradition (Kalama Sutta, AN 3.65)
      - Teachings are a raft for crossing, to be put down, not carried on your head (Alagaddupama Sutta, MN 22)
      - Do not get lost in unanswerable questions; pull out the poisoned arrow first (MN 63)
      - People who see only part of the truth argue like blind men describing an elephant (Udana 6.4)
      - Be an island to yourselves; rely on the teaching, not on a person (Mahaparinibbana Sutta, DN 16)
      # Mind training
      - The mind leads; actions and their results follow how we think (Dhammapada 1-2)
      - The untrained mind leaps like a monkey from branch to branch (SN 12.61)
      - Pain is the first arrow; our reaction is the second arrow we shoot ourselves (Sallatha Sutta, SN 36.6)
      - Desire, ill will, dullness, restlessness, and doubt cloud the mind like dyed, boiling, or muddy water (five hindrances, SN 46.55)
      - Effort should be like a well-tuned lute string, neither too tight nor too loose (AN 6.55)
      - Mindful breathing calms and clarifies the mind (Anapanasati Sutta, MN 118)
      - Heedfulness is the path to the deathless; heedlessness is the path to death (Dhammapada 21)
      - Conquering yourself is greater than conquering a thousand battles (Dhammapada 103)
      # Heart and ethics
      - Hatred is never ended by hatred, only by non-hatred (Dhammapada 5)
      - Conquer anger with calm, meanness with generosity, lies with truth (Dhammapada 223)
      - An insult you do not accept stays with the one who offered it (Akkosa Sutta, SN 7.2)
      - Loving-kindness for all beings, like a mother protecting her only child (Karaniya Metta Sutta, Sn 1.8)
      - Kindness, compassion, joy in others' success, and equanimity (the four brahmaviharas, DN 13)
      - Speak only what is true, timely, gentle, beneficial, and spoken with goodwill (AN 5.198)
      - Stay steady through gain and loss, praise and blame, fame and disgrace, pleasure and pain (eight worldly winds, AN 8.6)
      - Patience even when wronged, as in the simile of the saw (MN 21)
      - Contentment is the greatest wealth (Dhammapada 204)
      - Generosity frees the giver; if people knew its results they would not eat without sharing (Itivuttaka 26)
      - Gratitude is rare and marks a good person (AN 2.31-32)
      - Good friendship is the whole of the spiritual life (Upaddha Sutta, SN 45.2)
      - Remembering death makes each day count (Maranassati Sutta, AN 6.19)
      # Stories
      - Grief is universal; no household is untouched by death (Kisa Gotami, Therigatha commentary)
      - Even a violent man can change completely (Angulimala Sutta, MN 86)
      - A leader sacrifices for those in his care (the monkey king, Mahakapi Jataka 407)
      - Selfless giving even at great cost (the hare in the moon, Sasa Jataka 316)
      # Later traditions (label as the tradition, never as the Buddha's words)
      - A full cup cannot receive anything new (Zen story of Nan-in and the professor)
      - The finger pointing at the moon is not the moon (Zen and Mahayana teaching image)
      - Form is emptiness, emptiness is form; nothing exists on its own (Heart Sutra, Mahayana)
      - You cannot cover the world in leather, but you can wear sandals; guard your own mind (Shantideva, Bodhicaryavatara 5.13, Tibetan and Mahayana)
      - The burning house - skilful means to lead people to safety (Lotus Sutra parable, Mahayana)
      - Drive all blames into one - look at your own reaction first (Atisha's mind-training slogans, Tibetan)
      - Finding the ox - the path of taming the mind in ten stages (Zen ox-herding pictures)
    sources:
      - Pali Canon discourses (Digha, Majjhima, Samyutta, and Anguttara Nikayas)
      - Kalama Sutta (Anguttara Nikaya 3.65)
      - Dhammapada
      - Sutta Nipata, Udana, and Itivuttaka
      - Theragatha and Therigatha with commentaries
      - Jataka tales
      - Later traditions (Zen, Mahayana, Tibetan) when labeled as such
    misattributions:
      - '"Holding on to anger is like grasping a hot coal" (not found in the suttas)'
      - '"Three things cannot be long hidden: the sun, the moon, and the truth" (later paraphrase)'
      - '"Believe nothing, no matter where you read it..." (loose modern expansion of the Kalama Sutta)'
      - '"You will not be punished for your anger, you will be punished by your anger" (modern paraphrase)'
      - '"Peace comes from within. Do not seek it without." (modern)'
      - '"What you think, you become" / "The mind is everything" (loose modern compression of Dhammapada 1)'
      - '"Do not dwell in the past, do not dream of the future..." (modern)'
    quotes:
      - text: 'Hatred is never appeased by hatred in this world. By non-hatred alone is hatred appeased. This is a law eternal.'
        source: 'Dhammapada 5 (tr. Buddharakkhita)'
      - text: 'Though one may conquer a thousand times a thousand men in battle, yet he indeed is the noblest victor who conquers himself.'
        source: 'Dhammapada 103 (tr. Buddharakkhita)'
      - text: 'Health is the most precious gain and contentment the greatest wealth.'
        source: 'Dhammapada 204 (tr. Buddharakkhita)'
    portrayal: A human teacher and reasoner, not a deity or miracle worker; calm, wry, and respectful; no caricature.
    setting: Forests, riverbanks, village paths, and monastic groves of the Gangetic plain; saffron robes, alms bowls, oil lamps.
  - id: ambedkar
    name: B. R. Ambedkar
    era: 1891-1956, India
    core_ideas:
      - Reason and morality should judge customs, not tradition or birth
      - Educate, agitate, organize
      - Liberty, equality, and fraternity must go together
      - Buddhism read as a rational, ethical path (Navayana)
    sources:
      - Annihilation of Caste (1936)
      - The Buddha and His Dhamma (1957)
      - Speech to the Constituent Assembly, 25 November 1949
    misattributions:
      - Verify any short motivational quote against his speeches and writings before use
    quotes:
      - text: 'Educate, agitate, organize.'
        source: 'Closing message, All-India Depressed Classes Conference, Nagpur (1942)'
    portrayal: A scholar and reformer of quiet resolve; treat caste themes with care and accuracy.
    setting: Libraries, the Constituent Assembly hall, Indian towns and villages, a blue-and-white palette.
  - id: phule
    name: Mahatma Jyotirao Phule
    era: 1827-1890, Pune, India
    core_ideas:
      - Education is the root of freedom; ignorance breeds every other injustice
      - Caste hierarchy and priestly authority must be questioned with reason
      - Education for women and the oppressed is a moral duty
      - Truth is found by inquiry, not inherited authority
    sources:
      - Gulamgiri (Slavery, 1873)
      - Shetkaryacha Asud (The Cultivator's Whipcord, 1883)
      - Sarvajanik Satya Dharma
    quotes:
      - text: 'Vidyevina mati geli, mativina niti geli, nitivina gati geli, gativina vitta gele, vittavina shudra khachale, itke anarth eka avidyene kele. (Without education, wisdom was lost; without wisdom, morals; without morals, progress; without progress, wealth; without wealth, the Shudras were ruined. All this from the lack of education alone.)'
        source: 'Shetkaryacha Asud (1883)'
    misattributions:
      - Check English quotes against Gulamgiri or Shetkaryacha Asud before using them.
    portrayal: A reformer who, with Savitribai Phule, opened schools for girls and the oppressed; practical and fearless.
    setting: 1850s Pune, the first girls' school at Bhide Wada, slates and chalk.
  - id: osho
    name: Osho (Rajneesh)
    era: 1931-1990, India
    core_ideas:
      - Question conditioning and inherited religious dogma
      - Meditation as watchful awareness rather than belief
      - Celebrate life instead of renouncing it
      - The individual matters more than the crowd or the institution
    sources:
      - Talks published as books (for example The Book of Secrets; Courage)
    misattributions:
      - A huge number of "Osho quotes" online are paraphrases or invented; only quote wording checked against a specific book.
    # Image tools refuse to draw him by name; art prompts use this instead.
    art_alias: an elderly Indian mystic speaking in his Pune ashram in the 1980s
    portrayal: Engage his ideas critically; he is controversial (including the Rajneeshpuram events of the 1980s), so never present him as an unquestionable guru.
    setting: A quiet ashram garden in Pune, simple meditation hall.

# Art direction for posts. A story mode picks a default; the user can override.
visual_styles:
  - id: cinematic_photo
    name: Cinematic photo
    palette: night
    recipe: >-
      Photorealistic cinematic film still, shot on a full-frame cinema camera
      with an 85mm lens at f/1.8, shallow depth of field. One motivated key
      light with a soft rim light and deep, rich shadows; subtle volumetric
      haze. Teal-and-amber film color grade, fine film grain, natural skin
      texture with visible pores, realistic fabric weave.
    avoid: plastic or airbrushed skin, extra or fused fingers, oversaturation, cartoon or illustration look, HDR halos
  - id: living_thinker
    name: Living thinker (photoreal)
    palette: night
    recipe: >-
      Photorealistic historical recreation of the featured thinker in their
      own era and place, like a still from a prestige historical film.
      Era-accurate clothing, architecture, and materials matching the
      thinker's appearance; no modern objects unless the scene is set today.
      Soft natural key light (dawn, dusk, or lamp light), gentle rim light,
      atmospheric depth, 85mm lens, shallow depth of field, warm film grade.
    avoid: glowing halo or aura, deity or superhero styling, anachronisms, wrong ethnicity for the thinker, plastic skin, extra fingers
  - id: thinker_statue
    name: Thinker statue (museum photo)
    palette: night
    recipe: >-
      Museum-grade photograph of a classical statue or bust of the featured
      thinker in a material true to their tradition (a marble or bronze bust
      for Greek and Roman thinkers, weathered bronze or stone for the Buddha,
      a bronze memorial statue for modern figures): patina, fine cracks,
      moss or small flowers. Hard directional side light carving the face
      out of darkness, faint haze in the beam, 100mm lens at f/2.8 with
      razor-thin focus, dark moody background.
    avoid: shiny new plastic statue, souvenir-shop look, cartoon features, cluttered background, decorative misuse of the statue
  - id: 3d_render
    name: 3D render
    palette: night
    recipe: >-
      High-end 3D animated-film render with stylized but realistic
      proportions: subsurface scattering on skin, detailed cloth simulation
      on robes, soft global illumination, warm practical light against cool
      ambient light, gentle depth of field, cinematic composition and rich
      color grade.
    avoid: low-poly or toy look, flat lighting, uncanny faces, plastic sheen, distorted hands
  - id: painterly
    name: Painterly parchment
    palette: day
    recipe: >-
      Warm painterly portrait in a classical fine-art style, like a
      museum oil or gouache painting on aged cream paper. Soft golden-hour light,
      muted ochre, saffron, terracotta and sepia tones, gentle brush texture,
      high detail on the figure, soft vignette.
    avoid: photographic look, neon colors, harsh contrast
  - id: conceptual_metaphor
    name: Conceptual metaphor (photo)
    palette: night
    recipe: >-
      Photorealistic conceptual still life that turns the idea into one
      surreal but believable physical metaphor (for example dominoes, a
      bird held or released, a tree split between two seasons, one red bird
      among black ones). Few or no people; a tiny human figure only for
      scale. Clean studio-quality composition, a single strong light, crisp
      macro detail, tactile materials, muted background.
    avoid: clutter, more than one metaphor, cartoon look, signboards or labels on objects, cheap stock-photo feel
  - id: storybook_monk
    name: Storybook young monk
    palette: night
    recipe: >-
      Warm storybook 3D-animated look starring a small, cute young novice
      monk with a shaved head and an oversized saffron robe, big expressive
      eyes, gentle humor. Soft painterly textures, glowing practical light
      (fireflies, a lantern, sunset), lush detailed nature, cozy cinematic
      depth of field.
    avoid: chibi distortion, creepy or uncanny eyes, adult Buddha in childish form, plastic toy look
  - id: ink_wash
    name: Ink-wash landscape
    palette: day
    recipe: >-
      East Asian ink-wash (sumi-e) painting on textured rice paper: misty
      layered mountains, a single small monk figure, one accent of red
      (sun or seal-free blossom), expressive dry-brush strokes, generous
      empty space.
    avoid: calligraphy, red seal stamps, signatures, saturated colors
  - id: narrative_painting
    name: Story-scene oil painting
    palette: day
    recipe: >-
      Realistic classical Indian academic oil painting of one dramatic story
      moment with several figures: era-accurate clothing and village
      architecture, readable gestures and facial expressions that tell the
      story at a glance, warm natural daylight, rich detail, fine brushwork.
    avoid: modern objects, caricature, crowded unreadable action, signboards
  - id: fine_line_symbolic
    name: Fine-line symbolic close-up
    palette: night
    recipe: >-
      Soft East Asian fine-line (gongbi) illustration with delicate outlines
      and gentle gradients, on one bold flat background color. A tight,
      symbolic close-up that shows only part of a figure (a hand, a robe
      sleeve) interacting with an animal or object; a single small glow of
      light at the point of contact.
    avoid: full-body figures, busy backgrounds, harsh shading, seals
  - id: golden_light
    name: Golden light (uplifting)
    palette: day
    recipe: >-
      Cinematic, uplifting golden-hour scene: a radiant low sun behind the
      subject, god rays through mist or trees, warm amber and honey tones,
      drifting clouds or birds, luminous atmospheric haze, rich detail in
      robes, rock, water, and foliage, like a still from an epic film.
    avoid: muddy colors, flat midday light, a cluttered sky, oversaturated orange, plastic skin
  - id: ink_gold
    name: Ink and gold
    palette: day
    recipe: >-
      East Asian ink-wash painting in black, white, and soft grey with gold
      leaf as the only accent: swirling ink waves and clouds framing the
      subject, misty layered mountains, a few floating gold lotus petals and
      sparks, strong light-versus-dark contrast that tells the idea, dramatic
      yet elegant composition.
    avoid: colors other than black, grey, white, and gold; calligraphy; seals; a cluttered upper third
  - id: illustrated_watercolor
    name: Illustrated watercolor (book page)
    palette: day
    recipe: >-
      Hand-drawn illustration in warm watercolor and fine ink line on cream,
      lightly textured paper, like a page from a gentle illustrated book:
      monks in saffron and maroon robes with simple, kind, expressive faces,
      soft pink and sage washes, plenty of clean paper around each drawing,
      bold deep-red headings and dark brown serif lettering that are crisp
      and easy to read.
    avoid: photorealism, 3D render look, clutter, cramped lettering, misspellings

# Places around the world for the art. "Auto" rotates through them so the
# feed does not repeat a place; a post can also pick one in the review UI.
sceneries:
  - id: desert_dunes
    name: Desert dunes
    description: Wind-rippled sand dunes stretching to the horizon, a single line of footprints, wide empty sky (like the Sahara or the Thar desert)
  - id: tropical_beach
    name: Tropical beach
    description: A quiet tropical beach with gentle waves, wet sand reflecting the sky, and palm trees at the edge (like the south coast of Sri Lanka)
  - id: rocky_coast
    name: Rocky ocean coast
    description: A dramatic rocky coastline with waves breaking against dark cliffs and sea spray in the air (like Big Sur or the coast of Cornwall)
  - id: open_ocean
    name: Open ocean
    description: The open ocean seen from a small wooden boat, endless water and horizon in every direction
  - id: zen_garden
    name: Zen garden
    description: A Japanese Zen garden with raked gravel, moss-covered stones, and maple trees beside a wooden temple veranda (like Kyoto)
  - id: lotus_pond
    name: Lotus pond garden
    description: A temple garden pond full of lotus flowers and broad leaves, with stone steps leading to the water
  - id: cherry_blossoms
    name: Cherry blossom park
    description: A park path under cherry trees in full bloom with petals drifting through the air
  - id: himalayan_peaks
    name: Himalayan peaks
    description: High snow-capped Himalayan peaks with prayer flags moving in the wind and a small stone stupa (like Ladakh or Nepal)
  - id: misty_karst
    name: Misty karst mountains
    description: Tall limestone karst mountains rising from a winding river, layered into the distance (like Guilin or Ha Long Bay)
  - id: alpine_lake
    name: Mountain lake
    description: A perfectly still mountain lake mirroring the peaks and pine forest around it (like Lake Bled or Lake Louise)
  - id: forest_waterfall
    name: Rainforest waterfall
    description: A lush rainforest with a tall waterfall, ferns, mossy rocks, and drifting spray
  - id: bamboo_grove
    name: Bamboo grove
    description: A tall bamboo grove with a narrow path and stems rising out of sight (like Arashiyama)
  - id: stupa_plains
    name: Plains of ancient stupas
    description: Wide plains dotted with hundreds of ancient brick stupas and temples into the distance (like Bagan in Myanmar)
  - id: rice_terraces
    name: Rice terraces
    description: Green rice terraces stepping down a hillside with a small farmer's hut (like Bali or northern Vietnam)
  - id: snowy_forest
    name: Snowy pine forest
    description: A silent pine forest under deep fresh snow with a narrow trail between the trees
  - id: autumn_valley
    name: Autumn valley
    description: A valley of red, orange, and gold trees with a clear river winding through it
  - id: savanna
    name: Savanna
    description: A wide golden savanna with one lone acacia tree and distant hills
  - id: frozen_north
    name: Frozen north
    description: A frozen lake and snowy mountains in the far north, with ice cracks and wide open sky (like Iceland or Norway)
  - id: sea_cave
    name: Sea cave
    description: A large sea cave opening onto the ocean, light entering through the mouth of the cave and reflecting on wet rock
  - id: cave_temple
    name: Cave temple
    description: An ancient rock-cut cave temple with carved pillars and a large stone Buddha deep inside (like Ajanta, Ellora, or Dambulla)
  - id: mountain_monastery
    name: Cliffside monastery
    description: A small monastery clinging to a cliff above a deep forested valley (like Taktsang in Bhutan)
  - id: quiet_city
    name: Quiet city
    description: A modern city street or rooftop early in the day, almost empty, with buildings fading into the distance

# Weather and light, rotated separately so the feed is not always sunny.
weathers:
  - id: golden_hour
    name: Golden hour
    description: Low warm sunlight at sunrise or sunset with long soft shadows
  - id: overcast
    name: Soft overcast
    description: A soft grey overcast sky with even, shadowless light and muted colors
  - id: monsoon_rain
    name: Monsoon rain
    description: Heavy monsoon rain, wet glistening surfaces, puddles, and dark rain clouds
  - id: misty_morning
    name: Misty morning
    description: Thick morning mist and fog softening everything into layers of grey and blue
  - id: snowfall
    name: Falling snow
    description: Gently falling snow, cold blue-white light, and quiet stillness
  - id: blue_hour
    name: Blue hour
    description: Deep blue twilight just after sunset with the first lights appearing
  - id: moonlit_night
    name: Moonlit night
    description: A clear night lit by a full moon and stars, silver-blue light and deep shadows
  - id: storm_clouds
    name: Storm clouds
    description: Dark dramatic storm clouds with a single break of light falling through them
  - id: after_rain
    name: After the rain
    description: Just after rain, wet everything, fresh air, drops on leaves, and clearing clouds
  - id: lamplight
    name: Lamplight
    description: Darkness lit only by oil lamps or candles, warm small pools of light in deep shadow

# Engagement: the closing call to action shown in a Reel's last seconds, and
# the numbered series ("Day 4 of 30") a post can join.
engagement:
  default_cta: Send this to someone who needs it
  ctas:
    - Send this to someone who needs it
    - Save this for a hard day
    - Follow for one teaching a day
    - Which one are you? Tell me below
  series:
    name: 30 days with the Buddha
    length: 30
