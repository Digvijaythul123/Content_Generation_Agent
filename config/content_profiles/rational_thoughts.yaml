id: rational_thoughts
display_name: Critical Thinking / Rational Thoughts
language: English

audience:
  description: Curious people interested in challenging beliefs through reason, science, critical thinking, secularism, humanism, and freedom of thought

objectives:
  - Challenge beliefs and popular claims with reason, evidence, science, and clear argument
  - Explain complex ideas accessibly while distinguishing established findings from uncertainty
  - Advocate secularism, humanism, and freedom of thought without demeaning people who disagree
  - Encourage curiosity, intellectual humility, and independent thought rather than presenting enlightenment as certainty

voice:
  traits:
    - Curious, analytical, and evidence-led
    - Clear, accessible, and thought-provoking
    - Humanist and supportive of freedom of thought
    - Fair-minded about uncertainty and strong counterarguments
    - Warm and personal, speaking to the viewer as "you" about situations they actually live
    - Shareable, writing lines someone would send to a friend or loved one who needs them
  avoid:
    - Unsupported scientific, historical, or causal claims
    - False certainty, cherry-picked evidence, and misleading simplifications
    - Mocking or stereotyping people based on religion or worldview
    - Contrarianism, preachiness, and treating disagreement as ignorance
    - Generic advice and motivational cliches
    - Overpromising comfort such as "you can recover from anything"; stay hopeful but honest
    - Abstract or academic wording on screen when an everyday word works

topics:
  - Critical thinking and reasoning
  - Scientific literacy, evidence, and the limits of scientific knowledge
  - Cognitive biases, skepticism, and decision making
  - Secularism, humanism, ethics, and freedom of thought
  - Philosophy, meaning, and questions about human existence
  - Evaluating claims, misinformation, and pseudoscience
  - Correlation, causation, and confounding factors
  - Human behavior, culture, and popular beliefs

visual:
  image_style:
    - Striking, realistic imagery (cinematic film stills, museum-grade statue photography, or high-end 3D renders) chosen per post
    - Clear visual metaphors for evidence, belief, uncertainty, and perspective
    - One dominant light source and a deliberate color grade per image
  setting:
    - Everyday human and cultural contexts rather than default corporate scenes
    - Respectful, non-caricatured treatment of philosophical and secular themes
  image_requirements:
    - Vertical composition
    - No text inside image
  camera:
    - Purposeful, readable framing that supports the argument
    - Use close details or visual contrasts to clarify an idea
    - Dramatic but purposeful light; never spectacle that contradicts the point
  music:
    - Subtle, reflective instrumental bed
    - No vocals
    - Avoid forced inspirational endings
  subtitles:
    - Burned-in captions
    - High-contrast, readable typography
    - Match voiceover timing

# Applied to every post: thinkers are voices to examine, not authorities.
critical_lens:
  - Treat every idea, including the featured thinker's, as a claim to examine, not a commandment.
  - Give the viewer one concrete way to test, check, or apply the idea in their own life.
  - Name a limit, counterpoint, or context where it matters (where the thinker was wrong, contested, or a product of their time).
  - Separate evidence from belief and opinion; never present a paraphrase as a quotation.
  - Celebrate questioning rather than obedience; no guru worship, including of the featured thinker.

# Story Reels: one real idea from one thinker, told in a selected story mode.
subtype_label: Story mode
reel_duration_seconds:
  minimum: 30
  maximum: 60

subtypes:
  - id: parable
    default_visual_style: 3d_render
    name: Modern Parable
    definition: Retell a classic story or teaching as a short modern-day scene with a clear turn and takeaway.
    structure: Hook with a relatable modern situation; the thinker's idea arrives through action, not lecture; quiet twist; one-line takeaway.
    background: Warm cinematic light, grounded everyday setting that transitions to the thinker's era for the key moment; soft acoustic or sitar-like bed.
    example: The mustard seed story retold in a hospital waiting room.
  - id: comedy
    default_visual_style: cinematic_photo
    name: Witty Comedy
    definition: Idea-driven humor where the joke lands on human behavior and irrational habits, never on the thinker or on believers.
    structure: Instant absurd premise; escalate through the habit the idea exposes; the thinker's calm logic is the punchline; short reflective button.
    background: Bright, slightly exaggerated colors and clean framing; playful pizzicato or light percussion with a comic pause before the punchline.
    example: Diogenes reviewing a self-help influencer's morning routine.
  - id: thoughtful
    default_visual_style: living_thinker
    name: Thoughtful Reflection
    definition: A calm, reflective story that leaves one line the viewer will remember.
    structure: Gentle hook image; a small human moment; the idea reframes it; end on a still, memorable line.
    background: Slow, painterly visuals with golden-hour or candle light, mist, water, or open landscapes; ambient pads or soft flute, no vocals.
    example: A student keeps a grudge like a hot coal and finally notices who is getting burned.
  - id: thought_provoking
    default_visual_style: cinematic_photo
    name: Thought-Provoking Dilemma
    definition: A puzzle, paradox, or dilemma that ends on an open question inviting comments.
    structure: Pose the dilemma in the first two seconds; show two tempting answers; the thinker's tool reframes it; end on a direct question to the viewer.
    background: High-contrast, moody lighting and symbolic split compositions; low pulsing drone that builds tension and cuts to silence on the final question.
    example: Socrates asks a confident commenter how they would know if they were wrong.
  - id: time_traveler
    default_visual_style: cinematic_photo
    name: Thinker in Today's World
    definition: The thinker encounters a modern situation and examines it with their own method.
    structure: Fish-out-of-water hook; the modern claim or habit; the thinker applies their method; the modern person's realization; light closing beat.
    background: Era-accurate figure contrasted against vivid modern settings such as phones, malls, or city streets; music blends an ancient instrument with a modern beat.
    example: The Buddha applies the Kalama Sutta to a viral WhatsApp forward.
  - id: myth_buster
    default_visual_style: thinker_statue
    name: Myth Buster
    definition: A popular quote or claim attributed to the thinker is checked against what the source actually says.
    structure: Show the viral quote; ask where it comes from; reveal the source or its absence; present the real idea; invite viewers to check sources.
    background: Clean documentary look with paper, manuscript, and archive textures and stamp or highlight effects; steady investigative beat.
    example: "Did the Buddha really say 'Holding on to anger is like drinking poison'?"
  - id: mirror
    default_visual_style: cinematic_photo
    name: Mirror (Personal Truth)
    definition: A short, warm truth spoken to the viewer about something they feel (overthinking, conflict, comparison, setbacks, loneliness, people-pleasing), grounded in a thinker's idea and worth sending to someone you care about.
    structure: Title names who it is for (for example "For the overthinker"); Main_point is one second-person line of at most 12 words, often a paradox, contrast, or permission; Supporting_copy is a small credit such as "— Seneca" for a verified quote or "— inspired by Epictetus" for a paraphrase; the caption adds one honest nuance and invites sharing.
    background: An intimate, relatable everyday scene or a quiet symbolic image with one warm light; soft piano, flute, or lo-fi bed.
    example: '"Not every opinion needs your reply." — inspired by Epictetus, with a caption that notes when replying does matter.'
  - id: verified_quote
    default_visual_style: thinker_statue
    name: Verified Quote
    definition: One exact, sourced quote from the thinker, followed by a critical-thinking test of it.
    structure: Title is a short hook such as "Test this"; Main_point is the exact quote in quotation marks; Supporting_copy is the attribution and source; the caption explains the idea, gives one way to test or apply it, and names a limit or counterpoint.
    background: A dignified portrait or symbolic scene matching the thinker's era; calm, high-contrast light; a slow, thoughtful music bed.
    example: Epictetus on how our judgments, not events, disturb us, followed by a ten-second test the viewer can try today.

thinkers:
  - id: buddha
    name: The Buddha (Siddhartha Gautama)
    era: c. 5th century BCE, northern India
    core_ideas:
      # Framework
      - Life involves dissatisfaction (dukkha), it has a cause, it can end, and there is a path (Four Noble Truths, SN 56.11)
      - A practical path of right view, intention, speech, action, livelihood, effort, mindfulness, and concentration (Noble Eightfold Path, SN 56.11)
      - The middle way between indulgence and harsh self-denial (SN 56.11)
      - Everything conditioned is impermanent (Dhammapada 277)
      - No fixed, unchanging self can be found in body or mind (Anattalakkhana Sutta, SN 22.59)
      - Things arise from causes and conditions, not by fate or chance (dependent origination, SN 12.2)
      - Karma is intention; what shapes us is the intent behind our actions, not luck or ritual (AN 6.63)
      # Questioning and wisdom
      - Test teachings yourself instead of accepting them on authority or tradition (Kalama Sutta, AN 3.65)
      - Teachings are a raft for crossing, to be put down, not carried on your head (Alagaddupama Sutta, MN 22)
      - Do not get lost in unanswerable questions; pull out the poisoned arrow first (MN 63)
      - People who see only part of the truth argue like blind men describing an elephant (Udana 6.4)
      - Be an island to yourselves; rely on the teaching, not on a person (Mahaparinibbana Sutta, DN 16)
      # Mind training
      - The mind leads; actions and their results follow how we think (Dhammapada 1-2)
      - The untrained mind leaps like a monkey from branch to branch (SN 12.61)
      - Pain is the first arrow; our reaction is the second arrow we shoot ourselves (Sallatha Sutta, SN 36.6)
      - Desire, ill will, dullness, restlessness, and doubt cloud the mind like dyed, boiling, or muddy water (five hindrances, SN 46.55)
      - Effort should be like a well-tuned lute string, neither too tight nor too loose (AN 6.55)
      - Mindful breathing calms and clarifies the mind (Anapanasati Sutta, MN 118)
      - Heedfulness is the path to the deathless; heedlessness is the path to death (Dhammapada 21)
      - Conquering yourself is greater than conquering a thousand battles (Dhammapada 103)
      # Heart and ethics
      - Hatred is never ended by hatred, only by non-hatred (Dhammapada 5)
      - Conquer anger with calm, meanness with generosity, lies with truth (Dhammapada 223)
      - An insult you do not accept stays with the one who offered it (Akkosa Sutta, SN 7.2)
      - Loving-kindness for all beings, like a mother protecting her only child (Karaniya Metta Sutta, Sn 1.8)
      - Kindness, compassion, joy in others' success, and equanimity (the four brahmaviharas, DN 13)
      - Speak only what is true, timely, gentle, beneficial, and spoken with goodwill (AN 5.198)
      - Stay steady through gain and loss, praise and blame, fame and disgrace, pleasure and pain (eight worldly winds, AN 8.6)
      - Patience even when wronged, as in the simile of the saw (MN 21)
      - Contentment is the greatest wealth (Dhammapada 204)
      - Generosity frees the giver; if people knew its results they would not eat without sharing (Itivuttaka 26)
      - Gratitude is rare and marks a good person (AN 2.31-32)
      - Good friendship is the whole of the spiritual life (Upaddha Sutta, SN 45.2)
      - Remembering death makes each day count (Maranassati Sutta, AN 6.19)
      # Stories
      - Grief is universal; no household is untouched by death (Kisa Gotami, Therigatha commentary)
      - Even a violent man can change completely (Angulimala Sutta, MN 86)
      - A leader sacrifices for those in his care (the monkey king, Mahakapi Jataka 407)
      - Selfless giving even at great cost (the hare in the moon, Sasa Jataka 316)
      # Later traditions (label as the tradition, never as the Buddha's words)
      - A full cup cannot receive anything new (Zen story of Nan-in and the professor)
      - The finger pointing at the moon is not the moon (Zen and Mahayana teaching image)
    sources:
      - Pali Canon discourses (Digha, Majjhima, Samyutta, and Anguttara Nikayas)
      - Kalama Sutta (Anguttara Nikaya 3.65)
      - Dhammapada
      - Sutta Nipata, Udana, and Itivuttaka
      - Theragatha and Therigatha with commentaries
      - Jataka tales
      - Later traditions (Zen, Mahayana, Tibetan) when labeled as such
    misattributions:
      - '"Holding on to anger is like grasping a hot coal" (not found in the suttas)'
      - '"Three things cannot be long hidden: the sun, the moon, and the truth" (later paraphrase)'
      - '"Believe nothing, no matter where you read it..." (loose modern expansion of the Kalama Sutta)'
      - '"You will not be punished for your anger, you will be punished by your anger" (modern paraphrase)'
      - '"Peace comes from within. Do not seek it without." (modern)'
      - '"What you think, you become" / "The mind is everything" (loose modern compression of Dhammapada 1)'
      - '"Do not dwell in the past, do not dream of the future..." (modern)'
    quotes:
      - text: 'Hatred is never appeased by hatred in this world. By non-hatred alone is hatred appeased. This is a law eternal.'
        source: 'Dhammapada 5 (tr. Buddharakkhita)'
      - text: 'Though one may conquer a thousand times a thousand men in battle, yet he indeed is the noblest victor who conquers himself.'
        source: 'Dhammapada 103 (tr. Buddharakkhita)'
      - text: 'Health is the most precious gain and contentment the greatest wealth.'
        source: 'Dhammapada 204 (tr. Buddharakkhita)'
    statue: 'Head and shoulders of the Buddha: serene face, downcast half-closed eyes, elongated earlobes, tightly curled hair with the crown topknot (ushnisha), robe over one shoulder.'
    portrayal: A human teacher and reasoner, not a deity or miracle worker; calm, wry, and respectful; no caricature.
    appearance: >-
      A man of about 35 from 5th-century-BCE northern India with warm brown skin;
      serene face, eyes lowered and half-closed, faint gentle smile, elongated
      earlobes, short tightly curled dark hair with a small crown topknot
      (ushnisha); plain saffron cotton robe draped over the left shoulder leaving
      the right shoulder bare; calm hand gestures such as the earth-touching or
      teaching mudra; often beneath a Bodhi tree, with an alms bowl, oil lamp, or lotus.
    setting: Forests, riverbanks, village paths, and monastic groves of the Gangetic plain; saffron robes, alms bowls, oil lamps.
  - id: socrates
    name: Socrates
    era: 470-399 BCE, Athens
    core_ideas:
      - Wisdom begins with recognizing what you do not know
      - Question definitions; confident people often cannot define what they claim to know
      - The unexamined life is not worth living
      - It is better to suffer injustice than to commit it
    sources:
      - Plato, Apology
      - Plato, Euthyphro
      - Plato, Crito and Gorgias
    misattributions:
      - '"I know that I know nothing" (a later compression of Apology 21d)'
      - '"Strong minds discuss ideas, average minds discuss events..." (modern, not Socrates)'
    quotes:
      - text: 'The unexamined life is not worth living for a human being.'
        source: 'Plato, Apology 38a (tr. Grube)'
    statue: 'Head and shoulders of an old bald Athenian man with a broad snub nose, wide bulging eyes, thick lips, and a full curly beard, in a simple draped cloak.'
    portrayal: Barefoot, playful, persistent questioner; never smug.
    appearance: An older Athenian man with a broad snub nose, bulging eyes, bald crown, and a full grey beard, barefoot in a plain worn himation.
    setting: Athenian agora, stone colonnades, olive trees, marketplaces, dusty sandals.
  - id: epicurus
    name: Epicurus
    era: 341-270 BCE, Athens
    core_ideas:
      - A good life is calm pleasure, friendship, and freedom from fear, not luxury
      - Death is nothing to us; where death is, we are not
      - Distinguish natural and necessary desires from empty ones
      - Fear of gods and punishment is unnecessary for a good life
    sources:
      - Letter to Menoeceus
      - Principal Doctrines
      - Vatican Sayings
    misattributions:
      - The "Epicurean paradox" of evil is attributed to him by Lactantius; there is no surviving text by Epicurus
    quotes:
      - text: 'Death is nothing to us.'
        source: 'Principal Doctrines 2'
      - text: 'Of all the means which wisdom acquires to ensure happiness throughout the whole of life, by far the most important is friendship.'
        source: 'Principal Doctrines 27'
    statue: 'Head and shoulders of a calm Greek man with a long full beard and short curly hair, in a draped himation.'
    portrayal: A warm host in a garden, not a glutton.
    setting: A simple walled garden near Athens, shared meals of bread and olives, friends talking under trees.
  - id: diogenes
    name: Diogenes of Sinope
    era: c. 412-323 BCE, Athens and Corinth
    core_ideas:
      - Most social conventions and status symbols are unnecessary
      - Live simply and according to nature
      - Expose hypocrisy through action rather than argument
    sources:
      - Diogenes Laertius, Lives of Eminent Philosophers, Book VI
    misattributions:
      - Many anecdotes are later legends; present them as stories told about him
    quotes:
      - text: 'I am a citizen of the world.'
        source: 'Diogenes Laertius, Lives of Eminent Philosophers VI.63'
    statue: 'Head and shoulders of a gaunt old Greek man with a wild unkempt beard and tangled hair, in a coarse rough cloak.'
    portrayal: A cheeky provocateur with a lamp and a barrel; witty, not cruel.
    appearance: A lean, sun-darkened Greek man with a wild grey beard and tangled hair in a coarse ragged cloak, carrying an oil lamp, often near a large clay jar.
    setting: A large clay jar on a busy Greek street, a lamp in daylight, marble statues, crowded markets.
  - id: laozi
    name: Laozi
    era: Traditionally 6th century BCE, China (historicity uncertain)
    core_ideas:
      - Soft and yielding things overcome hard and rigid things, like water
      - Those who know do not speak; those who speak do not know
      - Knowing others is intelligence; knowing yourself is wisdom
      - Act without forcing (wu wei)
    sources:
      - Tao Te Ching (Daodejing), chapters 8, 33, 56, 78
    misattributions:
      - '"A journey of a thousand miles begins with a single step" is a loose translation of chapter 64'
      - Many modern "Lao Tzu" quotes on social media are not in the text
    quotes:
      - text: 'Knowing others is intelligence; knowing yourself is true wisdom.'
        source: 'Tao Te Ching, chapter 33'
    statue: 'Head and shoulders of an elderly Chinese sage with a long flowing white beard and topknot, in simple layered robes.'
    portrayal: A quiet, gently humorous old sage; note that his historicity is uncertain.
    appearance: An elderly Chinese sage with a long white beard and topknot in simple layered robes, often riding a water buffalo through a mountain pass.
    setting: Misty mountains, flowing rivers, bamboo, a mountain pass, an ox, ink-wash landscapes.
  - id: charvaka
    name: Charvaka (Lokayata) school
    era: c. 6th century BCE onward, India
    core_ideas:
      - Perception is the primary valid source of knowledge
      - Skepticism about the afterlife, rebirth, and ritual sacrifice
      - Rituals mainly benefit those who perform and sell them
    sources:
      - Fragments preserved in Madhavacharya's Sarva-darshana-sangraha (14th century)
      - References in Buddhist, Jain, and Hindu texts that critiqued the school
    misattributions:
      - Their own texts are lost; most surviving lines come from opponents, so present them as reported views
    quotes:
      - text: 'While life is yours, live joyously; none can escape Death''s searching eye.'
        source: 'Reported in Sarva-darshana-sangraha (tr. Cowell and Gough)'
    portrayal: Sharp, earthy, materialist debaters; do not reduce them to hedonism.
    setting: Ancient Indian debate courts, village fire-ritual grounds, dusty marketplaces, palm-leaf manuscripts.
  - id: hume
    name: David Hume
    era: 1711-1776, Scotland
    core_ideas:
      - A wise person proportions belief to the evidence
      - Extraordinary miracle claims require weighing testimony against the uniformity of experience
      - We infer causation from habit and constant conjunction, not from seeing necessity
      - You cannot derive an "ought" purely from an "is"
    sources:
      - An Enquiry Concerning Human Understanding (Section X, Of Miracles)
      - A Treatise of Human Nature (Book III)
    misattributions:
      - '"Extraordinary claims require extraordinary evidence" is Sagan''s phrasing, though inspired by Hume'
    quotes:
      - text: 'A wise man, therefore, proportions his belief to the evidence.'
        source: 'An Enquiry Concerning Human Understanding, Section X'
    statue: 'Head and shoulders of a heavy-set 18th-century Scottish gentleman, clean-shaven with a round face, in a cravat and coat.'
    portrayal: Genial, good-humored, and modest.
    setting: 18th-century Edinburgh, candlelit study, cobbled streets, coffee houses, quill and paper.
  - id: russell
    name: Bertrand Russell
    era: 1872-1970, Britain
    core_ideas:
      - The burden of proof lies with the person making an unfalsifiable claim (the celestial teapot)
      - Fools and fanatics are cocksure while wise people are full of doubt
      - Do not feel absolutely certain of anything
    sources:
      - '"Is There a God?" (1952), the teapot analogy'
      - '"The Triumph of Stupidity" (1933)'
      - '"A Liberal Decalogue" (1951)'
    misattributions:
      - The doubt line is a paraphrase; the original says "the stupid are cocksure while the intelligent are full of doubt"
    quotes:
      - text: 'The fundamental cause of the trouble is that in the modern world the stupid are cocksure while the intelligent are full of doubt.'
        source: '"The Triumph of Stupidity" (1933)'
    statue: 'Head and shoulders of a thin elderly Englishman with a sharp nose, swept-back white hair, clean-shaven, in a suit and tie.'
    portrayal: Dry, witty, precise; a pipe and a raised eyebrow.
    setting: Mid-century English study, books, a lecture hall, a teapot orbiting among planets.
  - id: ambedkar
    name: B. R. Ambedkar
    era: 1891-1956, India
    core_ideas:
      - Reason and morality should judge customs, not tradition or birth
      - Educate, agitate, organize
      - Liberty, equality, and fraternity must go together
      - Buddhism read as a rational, ethical path (Navayana)
    sources:
      - Annihilation of Caste (1936)
      - The Buddha and His Dhamma (1957)
      - Speech to the Constituent Assembly, 25 November 1949
    misattributions:
      - Verify any short motivational quote against his speeches and writings before use
    quotes:
      - text: 'Educate, agitate, organize.'
        source: 'Closing message, All-India Depressed Classes Conference, Nagpur (1942)'
    statue: 'Head and shoulders of B. R. Ambedkar: round glasses, receding hairline, clean-shaven, in a three-piece suit and tie, holding a book.'
    appearance: 'A dignified Indian scholar with round wire-rimmed glasses, a receding hairline, a full clean-shaven face, wearing a three-piece suit and tie, often holding a thick book; 1940s.'
    portrait_style: painterly
    portrayal: A scholar and reformer of quiet resolve; treat caste themes with care and accuracy.
    setting: Libraries, the Constituent Assembly hall, Indian towns and villages, a blue-and-white palette.
  - id: sagan
    name: Carl Sagan
    era: 1934-1996, United States
    core_ideas:
      - Extraordinary claims require extraordinary evidence
      - Use a baloney detection kit to evaluate claims
      - The Pale Blue Dot shows our shared fragility and smallness
      - Science is a way of thinking, not just a body of knowledge
    sources:
      - The Demon-Haunted World (1995)
      - Pale Blue Dot (1994)
      - Cosmos (1980)
    misattributions:
      - '"Somewhere, something incredible is waiting to be known" is often misattributed; avoid it'
    quotes:
      - text: 'Extraordinary claims require extraordinary evidence.'
        source: 'Cosmos (1980)'
    statue: 'Head and shoulders of a smiling middle-aged American man with dark side-parted hair, clean-shaven, in a turtleneck and jacket.'
    portrayal: Gentle wonder plus rigorous skepticism.
    setting: Observatories, starfields, the Voyager probe, Earth as a pale blue dot, a 1980s TV studio.
  - id: marcus_aurelius
    name: Marcus Aurelius
    era: 121-180 CE, Roman Empire
    core_ideas:
      - You control your judgments and actions, not outside events
      - Act rightly now instead of debating what a good person is
      - Everything changes; hold possessions and status lightly
      - Obstacles can become the material for action
      - Remember mortality to live with focus and humility
    sources:
      - Meditations (private notebooks, written c. 170-180 CE)
    quotes:
      - text: 'Waste no more time arguing about what a good man should be. Be one.'
        source: 'Meditations 10.16'
      - text: 'If it is not right, do not do it; if it is not true, do not say it.'
        source: 'Meditations 12.17'
    misattributions:
      - '"Everything we hear is an opinion, not a fact. Everything we see is a perspective, not the truth." (not in the Meditations)'
    statue: 'Head and shoulders of a Roman emperor with thick curly hair and a full curly beard, in a cuirass and military cloak.'
    portrayal: A tired, self-critical emperor writing notes to himself, not a motivational guru; note that he also ruled an empire at war.
    appearance: A bearded Roman man in his fifties with curly greying hair, wearing a plain military cloak, writing by oil lamp in a campaign tent.
    setting: Roman army camps on the Danube frontier, lamplit tents, marble Rome.
  - id: seneca
    name: Seneca
    era: c. 4 BCE-65 CE, Rome
    core_ideas:
      - Most suffering comes from imagined fears rather than events
      - Life is long enough if we stop wasting it
      - Practice hardship briefly so it loses its power over you
      - Anger is a temporary madness worth delaying
    sources:
      - Letters to Lucilius (Epistulae Morales)
      - On the Shortness of Life
      - On Anger
    quotes:
      - text: 'We suffer more often in imagination than in reality.'
        source: 'Letters to Lucilius 13.4'
      - text: 'It is not that we have a short time to live, but that we waste a lot of it.'
        source: 'On the Shortness of Life 1'
    misattributions:
      - '"Luck is what happens when preparation meets opportunity" (not Seneca)'
    statue: 'Head and shoulders of an elderly Roman man, balding with thin hair, a short beard, and deep lines on his face, in a toga.'
    portrayal: A sharp writer who preached simplicity while being one of Rome's richest men; acknowledge the tension honestly.
    appearance: An older balding Roman man with a short grey beard in a toga, writing letters at a wooden desk.
    setting: A Roman villa study with scrolls and wax tablets, Mediterranean light.
  - id: epictetus
    name: Epictetus
    era: c. 50-135 CE, Greece and Rome
    core_ideas:
      - We are disturbed not by events but by our judgments about them
      - Separate what is in your control from what is not
      - You cannot learn what you think you already know
      - Freedom is an inner discipline, not a social status
    sources:
      - Enchiridion (Handbook, recorded by Arrian)
      - Discourses (recorded by Arrian)
    quotes:
      - text: 'Men are disturbed not by things, but by the views which they take of things.'
        source: 'Enchiridion 5'
      - text: 'It is impossible for a man to learn what he thinks he already knows.'
        source: 'Discourses 2.17'
    misattributions:
      - Many "Epictetus" lines online are modern paraphrases; check the Enchiridion or Discourses before quoting.
    statue: 'Head and shoulders of a Greek Stoic teacher with a full beard and short hair, plain lined face, in a simple worn tunic; humble, not imperial.'
    portrayal: A former slave with a lame leg who became a teacher; plain-spoken and demanding.
    appearance: A bearded Greek man in a simple worn tunic, walking with a slight limp and a stick, teaching students in a bare classroom.
    setting: The school at Nicopolis, stone benches, simple oil lamps.
  - id: kabir
    name: Kabir
    era: 15th century, Varanasi, India
    core_ideas:
      - Rituals, scriptures, and caste do not make anyone holy; sincerity and love do
      - Look for faults in yourself before judging others
      - Book learning without understanding is empty
      - The divine, if anywhere, is within, not in temples or mosques
    sources:
      - Kabir's dohas (couplets) as collected in the Bijak and the Guru Granth Sahib
    quotes:
      - text: 'Bura jo dekhan main chala, bura na milya koi; jo dil khoja aapna, mujhsa bura na koi. (I set out to find the wicked and found none; when I searched my own heart, I found no one worse than me.)'
        source: 'Kabir, doha'
      - text: 'Pothi padhi padhi jag mua, pandit bhaya na koi; dhai aakhar prem ka, padhe so pandit hoi. (The world died reading books and no one became wise; whoever learns the two and a half letters of love becomes wise.)'
        source: 'Kabir, doha'
    misattributions:
      - Many couplets shared as Kabir online are modern; check standard collections before quoting.
    statue: 'Head and shoulders of a 15th-century Indian poet-weaver with a white beard, a simple cap or turban, and a plain shawl.'
    portrayal: A weaver-poet who mocked hypocrisy in every religion; witty, blunt, never preachy.
    appearance: A lean 15th-century Indian weaver in a simple white dhoti and shawl, sitting at a wooden handloom.
    setting: Varanasi lanes, river ghats, handlooms and spun cotton.
  - id: vivekananda
    name: Swami Vivekananda
    era: 1863-1902, India
    core_ideas:
      - Strength, self-reliance, and education over fear and fatalism
      - Test ideas through experience instead of blind belief
      - Serve people as the highest form of worship
      - Focus the mind on one idea and pursue it fully
    sources:
      - The Complete Works of Swami Vivekananda (including Raja Yoga, 1896)
    quotes:
      - text: 'Arise, awake, and stop not till the goal is reached.'
        source: 'Complete Works (adapted from Katha Upanishad 1.3.14)'
      - text: 'Take up one idea. Make that one idea your life; think of it, dream of it, live on that idea.'
        source: 'Raja Yoga (1896)'
    misattributions:
      - '"Talk to yourself once in a day, otherwise you may miss meeting an excellent person in this world." (unverified)'
    statue: 'Head and shoulders of a young Indian monk with a broad face, large eyes, a turban with a hanging tail, and arms folded across his chest.'
    portrait_style: painterly
    portrayal: Emphasize his rational, reformist, education-first side; he was also a religious monk, so do not present him as a secular thinker.
    appearance: 'A broad-faced young Indian monk with large expressive eyes and a strong, calm gaze, clean-shaven, wearing a saffron turban tied with a hanging tail and a long saffron robe, arms folded across his chest in his famous 1893 Chicago pose.'
    setting: Late 19th-century Kolkata, the Chicago Parliament of Religions hall (1893).
  - id: bhagat_singh
    name: Bhagat Singh
    era: 1907-1931, India
    core_ideas:
      - Progress requires criticizing and challenging inherited beliefs
      - Reason and independent thinking over blind faith
      - Courage to examine your own convictions, even near death
      - Ideas outlive individuals
    sources:
      - '"Why I Am an Atheist" (written in Lahore jail, 1930)'
      - Jail notebook and letters
    quotes:
      - text: 'Any man who stands for progress has to criticize, disbelieve and challenge every item of the old faith.'
        source: '"Why I Am an Atheist" (1930)'
      - text: 'Criticism and independent thinking are the two indispensable qualities of a revolutionary.'
        source: '"Why I Am an Atheist" (1930)'
    misattributions:
      - Many slogans attributed to him online are unsourced; quote "Why I Am an Atheist" or his letters directly.
    statue: 'Head and shoulders of a slim young Indian man with a thin moustache and a tilted felt fedora, in a collared shirt and coat.'
    portrait_style: painterly
    portrayal: A young, widely read revolutionary thinker; focus on his reasoning, not on glorifying violence.
    appearance: 'A slim young Indian man in his early twenties with sharp features, a thin moustache, and a felt fedora tilted slightly, wearing a collared shirt and coat, with a direct, confident gaze; 1929 Lahore.'
    setting: 1920s Lahore, prison cells with books, typewritten pamphlets.
  - id: phule
    name: Mahatma Jyotirao Phule
    era: 1827-1890, Pune, India
    core_ideas:
      - Education is the root of freedom; ignorance breeds every other injustice
      - Caste hierarchy and priestly authority must be questioned with reason
      - Education for women and the oppressed is a moral duty
      - Truth is found by inquiry, not inherited authority
    sources:
      - Gulamgiri (Slavery, 1873)
      - Shetkaryacha Asud (The Cultivator's Whipcord, 1883)
      - Sarvajanik Satya Dharma
    quotes:
      - text: 'Vidyevina mati geli, mativina niti geli, nitivina gati geli, gativina vitta gele, vittavina shudra khachale, itke anarth eka avidyene kele. (Without education, wisdom was lost; without wisdom, morals; without morals, progress; without progress, wealth; without wealth, the Shudras were ruined. All this from the lack of education alone.)'
        source: 'Shetkaryacha Asud (1883)'
    misattributions:
      - Check English quotes against Gulamgiri or Shetkaryacha Asud before using them.
    statue: 'Head and shoulders of a 19th-century Maharashtrian man with a thick moustache, a white pheta turban, and a shawl.'
    portrait_style: painterly
    portrayal: A reformer who, with Savitribai Phule, opened schools for girls and the oppressed; practical and fearless.
    appearance: 'A 19th-century Maharashtrian reformer with a thick moustache and a serious, kind gaze, wearing a white pheta turban, a white angarkha, and a shawl over his shoulders, standing near a modest schoolroom.'
    setting: 1850s Pune, the first girls' school at Bhide Wada, slates and chalk.
  - id: osho
    name: Osho (Rajneesh)
    era: 1931-1990, India
    core_ideas:
      - Question conditioning and inherited religious dogma
      - Meditation as watchful awareness rather than belief
      - Celebrate life instead of renouncing it
      - The individual matters more than the crowd or the institution
    sources:
      - Talks published as books (for example The Book of Secrets; Courage)
    misattributions:
      - A huge number of "Osho quotes" online are paraphrases or invented; only quote wording checked against a specific book.
    statue: 'Head and shoulders of an elderly Indian man with a very long wispy flowing beard, a tall knitted cap, and large intense eyes, in a flowing robe.'
    portrait_style: painterly
    portrayal: Engage his ideas critically; he is controversial (including the Rajneeshpuram events of the 1980s), so never present him as an unquestionable guru.
    appearance: 'An elderly Indian man with a very long, wispy white beard flowing down his chest, a bald crown under a tall, soft knitted woollen cap, large dark luminous eyes with an intense, direct gaze, wearing a flowing robe (white or deep maroon), seated in an armchair with one hand raised mid-gesture as he speaks.'
    setting: A quiet ashram garden in Pune, simple meditation hall.

# Art direction for posts. A story mode picks a default; the user can override.
visual_styles:
  - id: cinematic_photo
    name: Cinematic photo
    palette: night
    recipe: >-
      Photorealistic cinematic film still, shot on a full-frame cinema camera
      with an 85mm lens at f/1.8, shallow depth of field. One motivated key
      light with a soft rim light and deep, rich shadows; subtle volumetric
      haze. Teal-and-amber film color grade, fine film grain, natural skin
      texture with visible pores, realistic fabric weave.
    avoid: plastic or airbrushed skin, extra or fused fingers, oversaturation, cartoon or illustration look, HDR halos
  - id: living_thinker
    name: Living thinker (photoreal)
    palette: night
    recipe: >-
      Photorealistic historical recreation of the featured thinker in their
      own era and place, like a still from a prestige historical film.
      Era-accurate clothing, architecture, and materials matching the
      thinker's appearance; no modern objects unless the scene is set today.
      Soft natural key light (dawn, dusk, or lamp light), gentle rim light,
      atmospheric depth, 85mm lens, shallow depth of field, warm film grade.
    avoid: glowing halo or aura, deity or superhero styling, anachronisms, wrong ethnicity for the thinker, plastic skin, extra fingers
  - id: thinker_statue
    name: Thinker statue (museum photo)
    palette: night
    recipe: >-
      Museum-grade photograph of a classical statue or bust of the featured
      thinker in a material true to their tradition (a marble or bronze bust
      for Greek and Roman thinkers, weathered bronze or stone for the Buddha,
      a bronze memorial statue for modern figures): patina, fine cracks,
      moss or small flowers. Hard directional side light carving the face
      out of darkness, faint haze in the beam, 100mm lens at f/2.8 with
      razor-thin focus, dark moody background.
    avoid: shiny new plastic statue, souvenir-shop look, cartoon features, cluttered background, decorative misuse of the statue
  - id: 3d_render
    name: 3D render
    palette: night
    recipe: >-
      High-end 3D animated-film render with stylized but realistic
      proportions: subsurface scattering on skin, detailed cloth simulation
      on robes, soft global illumination, warm practical light against cool
      ambient light, gentle depth of field, cinematic composition and rich
      color grade.
    avoid: low-poly or toy look, flat lighting, uncanny faces, plastic sheen, distorted hands
  - id: painterly
    name: Painterly parchment
    palette: day
    recipe: >-
      Warm painterly portrait in a classical fine-art style, like a
      museum oil or gouache painting on aged cream paper. Soft golden-hour light,
      muted ochre, saffron, terracotta and sepia tones, gentle brush texture,
      high detail on the figure, soft vignette.
    avoid: photographic look, neon colors, harsh contrast
  - id: conceptual_metaphor
    name: Conceptual metaphor (photo)
    palette: night
    recipe: >-
      Photorealistic conceptual still life that turns the idea into one
      surreal but believable physical metaphor (for example dominoes, a
      bird held or released, a tree split between two seasons, one red bird
      among black ones). Few or no people; a tiny human figure only for
      scale. Clean studio-quality composition, a single strong light, crisp
      macro detail, tactile materials, muted background.
    avoid: clutter, more than one metaphor, cartoon look, text or signs on objects, cheap stock-photo feel
  - id: storybook_monk
    name: Storybook young monk
    palette: night
    recipe: >-
      Warm storybook 3D-animated look starring a small, cute young novice
      monk with a shaved head and an oversized saffron robe, big expressive
      eyes, gentle humor. Soft painterly textures, glowing practical light
      (fireflies, a lantern, sunset), lush detailed nature, cozy cinematic
      depth of field.
    avoid: chibi distortion, creepy or uncanny eyes, adult Buddha in childish form, plastic toy look, text in the image
  - id: ink_wash
    name: Ink-wash landscape
    palette: day
    recipe: >-
      East Asian ink-wash (sumi-e) painting on textured rice paper: misty
      layered mountains, a single small monk figure, one accent of red
      (sun or seal-free blossom), expressive dry-brush strokes, generous
      empty space.
    avoid: calligraphy, red seal stamps, signatures, text, saturated colors
  - id: narrative_painting
    name: Story-scene oil painting
    palette: day
    recipe: >-
      Realistic classical Indian academic oil painting of one dramatic story
      moment with several figures: era-accurate clothing and village
      architecture, readable gestures and facial expressions that tell the
      story at a glance, warm natural daylight, rich detail, fine brushwork.
    avoid: modern objects, caricature, crowded unreadable action, text or signs
  - id: fine_line_symbolic
    name: Fine-line symbolic close-up
    palette: night
    recipe: >-
      Soft East Asian fine-line (gongbi) illustration with delicate outlines
      and gentle gradients, on one bold flat background color. A tight,
      symbolic close-up that shows only part of a figure (a hand, a robe
      sleeve) interacting with an animal or object; a single small glow of
      light at the point of contact.
    avoid: full-body figures, busy backgrounds, harsh shading, text or seals
