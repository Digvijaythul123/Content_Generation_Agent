id: carousel
display_name: Carousel (swipe post)
content_fields:
  - title
  - main_point
  - slides
  - supporting_copy
  - visual_labels
  - design_prompt
  - caption
generation:
  content_kind: post
  prompt_template: carousel_generation.md
  instructions:
    - Create one Instagram carousel that teaches one idea across a few swipeable slides.
    - The cover must make people swipe; every slide is one short, plain thought.
    - Return a wordless art prompt for the cover; the slide text is added later.
media:
  aspect_ratio: "4:5"
  resolution: "1080x1350"
