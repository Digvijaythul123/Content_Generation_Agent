# Cloud scheduler: publishes scheduled posts every minute (see README section
# "Cloud scheduler"). KV holds the job queue and tokens; R2 holds the media.
name = "buddha-scheduler"
main = "src/index.js"
compatibility_date = "2025-09-01"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "JOBS"
id = "23f2df669c5d46ddbd59aa8e16d935f5"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dagnostic-reels"
