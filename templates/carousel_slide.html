<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: $background;
    color: $text;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center bottom;
    /* Crop the bottom strip where image tools put their watermark. */
    transform: scale(1.11); transform-origin: center top;
  }
  /* Inner and closing slides reuse the cover art, softly blurred and dark,
     so the whole carousel looks like one set and the words stay readable. */
  body.inner .art, body.closing .art {
    filter: blur(26px) brightness(.42) saturate(.85);
    transform: scale(1.25); transform-origin: center;
  }
  .shade { position: absolute; inset: 0; }
  body.cover .shade {
    background: radial-gradient(ellipse 85% 58% at 50% 26%,
      $background_rgba_strong 0%, $background_rgba_soft 45%, transparent 80%);
  }
  body.cover.tone-light { color: #2A1A0F; }
  body.cover.tone-light .shade {
    background: radial-gradient(ellipse 80% 55% at 50% 26%,
      rgba(255, 247, 232, .6) 0%, rgba(255, 247, 232, .25) 50%, transparent 78%);
  }
  body.cover.tone-light .hl { color: #8E1B1B; }
  .content { position: absolute; left: 100px; right: 100px; display: flex; flex-direction: column; text-align: center; }
  body.cover .content { top: 110px; height: 560px; justify-content: safe center; }
  body.inner .content, body.closing .content { top: 170px; bottom: 230px; justify-content: safe center; }
  .big { font-size: 86px; line-height: 1.1; letter-spacing: -0.5px; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
  body.inner .big { font-size: 80px; line-height: 1.2; }
  body.closing .big { font-size: 80px; line-height: 1.2; }
  body.cover.tone-light .big, body.cover.tone-light .small { text-shadow: 0 1px 14px rgba(255, 248, 236, .8); }
  .small { margin-top: 30px; font-size: 40px; font-style: italic; line-height: 1.3; opacity: .92; }
  .small:empty { display: none; }
  .hl { color: $accent; font-weight: 700; }
  .number {
    margin-bottom: 28px; color: $accent; font-size: 30px; letter-spacing: 6px;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  .number:empty { display: none; }
  /* Cover: an invitation to swipe. Closing: what to do next. */
  .hint {
    position: absolute; right: 70px; bottom: 80px; padding: 14px 26px; border-radius: 40px;
    font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 28px; letter-spacing: 1px;
    background: rgba(10, 8, 6, .55); color: #F7E7C4;
  }
  body.closing .hint { left: 140px; right: 140px; bottom: 150px; text-align: center; }
  .hint:empty { display: none; }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
    font-size: 26px; letter-spacing: 1px; opacity: .8;
  }
  body.cover .foot { display: none; }
  .counter {
    position: absolute; right: 70px; top: 70px; font-size: 26px; letter-spacing: 2px; opacity: .75;
    font-family: -apple-system, Helvetica, Arial, sans-serif;
  }
  .counter:empty { display: none; }
</style>
</head>
<body class="$kind tone-$tone">
$art
<div class="shade"></div>
<div class="counter">$counter</div>
<main class="content">
  <div class="number">$number</div>
  <div class="big" data-fit="40">$big</div>
  <div class="small" data-fit="26">$small</div>
</main>
<div class="hint">$hint</div>
<div class="foot">$handle</div>
<script>
  // Shrink long text until it fits inside the slide.
  const box = document.querySelector(".content");
  const fitted = [...document.querySelectorAll("[data-fit]")];
  for (let step = 0; step < 80 && box.scrollHeight > box.clientHeight; step++) {
    let changed = false;
    for (const element of fitted) {
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > Number(element.dataset.fit)) {
        element.style.fontSize = (size - 2) + "px";
        changed = true;
      }
    }
    if (!changed) break;
  }
  document.body.dataset.overflow = String(box.scrollHeight > box.clientHeight);
</script>
</body>
</html>
