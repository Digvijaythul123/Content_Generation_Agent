<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: $background;
    color: $text;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center bottom;
    /* Crop the bottom strip where image tools put their watermark. */
    transform: scale(1.11); transform-origin: center top;
  }
  /* A soft glow behind the words keeps them readable without a box. */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 75% 28% at 50% var(--glow-y, 560px),
      $background_rgba_soft 0%, $background_rgba_faint 45%, transparent 75%);
  }
  /* A soft fade under Instagram's caption area (also hides tool watermarks). */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(180deg, transparent 0%,
      $background_rgba_soft 40%, $background_rgba_strong 70%, $background 100%);
  }
  /* Text sits in the open top third, below Instagram's top bar. */
  .column {
    position: absolute; left: 90px; right: 90px; top: 250px; height: 640px;
    display: flex; flex-direction: column; text-align: center;
  }
  .copy { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; }
  .copy > * { flex-shrink: 0; }
  .title { display: none; }
  .quote {
    font-size: 86px; line-height: 1.12; letter-spacing: -0.5px;
    text-shadow: 0 2px 18px $background_rgba_soft;
  }
  .quote .hl { font-size: 1.16em; font-weight: 700; color: $accent; }
  .takeaway {
    margin-top: 34px; font-size: 46px; font-style: italic; line-height: 1.3;
    text-shadow: 0 2px 14px $background_rgba_soft;
  }
  .takeaway .hl { font-weight: 700; }
  /* Small brand mark above Instagram's caption area. */
  .handle {
    position: absolute; left: 0; right: 0; top: 1470px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-size: 30px; letter-spacing: 1px; opacity: .9;
    text-shadow: 0 1px 10px $background_rgba_soft;
  }
  .handle::before, .handle::after {
    content: ""; width: 90px; height: 2px; background: currentColor; opacity: .6;
  }
  .handle svg { width: 34px; height: 34px; margin-right: -8px; }

  /* Bright skies get dark text and a light glow; mid-tone skies get a
     stronger shade. The renderer measures the art behind the words. */
  body.tone-light { color: #2A1A0F; }
  body.tone-light .quote .hl { color: #8E1B1B; }
  body.tone-light .glow {
    background: radial-gradient(ellipse 80% 28% at 50% var(--glow-y, 560px),
      rgba(255, 247, 232, .62) 0%, rgba(255, 247, 232, .3) 45%, transparent 76%);
  }
  body.tone-light .quote, body.tone-light .takeaway {
    text-shadow: 0 1px 16px rgba(255, 248, 236, .85), 0 0 3px rgba(255, 248, 236, .6);
  }
  body.tone-mid .glow {
    background: radial-gradient(ellipse 80% 28% at 50% var(--glow-y, 560px),
      $background_rgba_strong 0%, $background_rgba_soft 45%, transparent 78%);
  }
  body.tone-mid .quote, body.tone-mid .takeaway {
    text-shadow: 0 2px 18px $background_rgba_strong, 0 0 4px $background_rgba_soft;
  }
  /* The handle sits lower, over the art, so it keeps its own shadow. */
  body.tone-light .handle { color: #FFF8EC; }

  /* Weather look: repaints art made in other light (for example a sunny
     image for a rainy-day post). Filters tint the art; the overlay adds
     the weather's color, and also covers motion clips. */
  .look { position: absolute; inset: 0; pointer-events: none; }
  body.look-golden_hour .art { filter: sepia(.18) saturate(1.15); }
  body.look-golden_hour .look { background: rgba(255, 168, 80, .12); }
  body.look-overcast .art { filter: saturate(.55) brightness(.9) contrast(.9); }
  body.look-overcast .look { background: rgba(150, 160, 176, .2); }
  body.look-monsoon_rain .art { filter: saturate(.5) brightness(.7) contrast(1.05); }
  body.look-monsoon_rain .look { background: linear-gradient(180deg, rgba(28, 40, 58, .5), rgba(28, 40, 58, .3)); }
  body.look-after_rain .art { filter: saturate(.85) brightness(.92); }
  body.look-after_rain .look { background: rgba(70, 95, 120, .16); }
  body.look-misty_morning .art { filter: saturate(.6) contrast(.78) brightness(1.04); }
  body.look-misty_morning .look { background: linear-gradient(180deg, rgba(222, 228, 236, .32), rgba(222, 228, 236, .5)); }
  body.look-snowfall .art { filter: saturate(.45) brightness(1.02) contrast(.92); }
  body.look-snowfall .look { background: rgba(205, 220, 240, .26); }
  body.look-blue_hour .art { filter: saturate(.7) brightness(.62); }
  body.look-blue_hour .look { background: rgba(24, 40, 96, .42); }
  body.look-moonlit_night .art { filter: saturate(.4) brightness(.45) contrast(1.1); }
  body.look-moonlit_night .look { background: rgba(18, 28, 70, .5); }
  body.look-storm_clouds .art { filter: saturate(.55) brightness(.6) contrast(1.2); }
  body.look-storm_clouds .look { background: rgba(32, 38, 48, .35); }
  body.look-lamplight .art { filter: brightness(.55) sepia(.25); }
  body.look-lamplight .look { background: radial-gradient(ellipse 70% 60% at 50% 70%, rgba(255, 170, 70, .18), rgba(10, 6, 2, .45)); }
  body.layer-text .look { display: none; }

  /* Layers used for the video: the background moves, the text stays crisp. */
  body.layer-background .column, body.layer-background .handle { visibility: hidden; }
  /* "chrome": the glow and fades alone, laid over a motion clip. */
  body.layer-chrome { background: transparent; }
  body.layer-chrome .art { display: none; }
  body.layer-chrome .column, body.layer-chrome .handle { visibility: hidden; }
  body.layer-text { background: transparent; }
  body.layer-text .art, body.layer-text .glow, body.layer-text .foot { display: none; }
  body.only-quote .takeaway, body.only-quote .handle,
  body.only-takeaway .quote, body.only-takeaway .kicker { visibility: hidden; }
  /* Series label, for example "Day 4 of 30". */
  .kicker {
    margin-bottom: 22px; font-family: -apple-system, Helvetica, Arial, sans-serif;
    font-size: 26px; letter-spacing: 5px; text-transform: uppercase; opacity: .85;
  }
  .kicker:empty { display: none; }
  body.only-title .column, body.only-title .handle { visibility: hidden; }
</style>
</head>
<body class="layer-$layer tone-$tone look-$look" data-place=".column" data-place-text=".copy" data-place-min="200" data-place-max="1440">
$art
<div class="look"></div>
<div class="glow"></div>
<div class="foot"></div>
<main class="column">
  <div class="copy">
    <div class="title">$title</div>
    <div class="kicker">$kicker</div>
    <div class="quote" data-fit="44">$main_point</div>
    <div class="takeaway" data-fit="28">$supporting_copy</div>
  </div>
</main>
<div class="handle"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 28c-5-3-8-8-8-13 4 1 7 4 8 7 1-3 4-6 8-7 0 5-3 10-8 13z"/><path d="M17 28c-2-5-2-11 0-17 2 6 2 12 0 17z"/></svg>$footer</div>
<script>
  // Shrink long copy until it fits inside the text area.
  const copy = document.querySelector(".copy");
  const fitted = [...document.querySelectorAll("[data-fit]")];
  for (let step = 0; step < 80 && copy.scrollHeight > copy.clientHeight; step++) {
    let changed = false;
    for (const element of fitted) {
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > Number(element.dataset.fit)) {
        element.style.fontSize = (size - 2) + "px";
        changed = true;
      }
    }
    if (!changed) break;
  }
  document.body.dataset.overflow = String(copy.scrollHeight > copy.clientHeight);
</script>
$placement
</body>
</html>
