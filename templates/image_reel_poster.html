<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: $background;
    color: $text;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center bottom;
    /* Crop the bottom strip where image tools put their watermark. */
    transform: scale(1.11); transform-origin: center top;
  }
  /* A soft glow behind the words keeps them readable without a box. */
  .glow {
    position: absolute; left: 0; right: 0; top: 0; height: 900px;
    background: radial-gradient(ellipse 75% 60% at 50% 34%,
      $background_rgba_soft 0%, $background_rgba_faint 45%, transparent 75%);
  }
  /* A soft fade under Instagram's caption area (also hides tool watermarks). */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(180deg, transparent 0%,
      $background_rgba_soft 40%, $background_rgba_strong 70%, $background 100%);
  }
  /* Text sits in the open top third, below Instagram's top bar. */
  .column {
    position: absolute; left: 90px; right: 90px; top: 250px; height: 640px;
    display: flex; flex-direction: column; text-align: center;
  }
  .copy { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; }
  .copy > * { flex-shrink: 0; }
  .title { display: none; }
  .quote {
    font-size: 86px; line-height: 1.12; letter-spacing: -0.5px;
    text-shadow: 0 2px 18px $background_rgba_soft;
  }
  .quote .hl { font-size: 1.16em; font-weight: 700; color: $accent; }
  .takeaway {
    margin-top: 34px; font-size: 40px; font-style: italic; line-height: 1.3;
    opacity: .92; text-shadow: 0 2px 14px $background_rgba_soft;
  }
  .takeaway .hl { font-weight: 700; }
  /* Small brand mark above Instagram's caption area. */
  .handle {
    position: absolute; left: 0; right: 0; top: 1470px;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    font-size: 30px; letter-spacing: 1px; opacity: .9;
    text-shadow: 0 1px 10px $background_rgba_soft;
  }
  .handle::before, .handle::after {
    content: ""; width: 90px; height: 2px; background: currentColor; opacity: .6;
  }
  .handle svg { width: 34px; height: 34px; margin-right: -8px; }

  /* Layers used for the video: the background moves, the text stays crisp. */
  body.layer-background .column, body.layer-background .handle { visibility: hidden; }
  body.layer-text { background: transparent; }
  body.layer-text .art, body.layer-text .glow, body.layer-text .foot { display: none; }
  body.only-quote .takeaway, body.only-quote .handle,
  body.only-takeaway .quote { visibility: hidden; }
  body.only-title .column, body.only-title .handle { visibility: hidden; }
</style>
</head>
<body class="layer-$layer">
$art
<div class="glow"></div>
<div class="foot"></div>
<main class="column">
  <div class="copy">
    <div class="title">$title</div>
    <div class="quote" data-fit="44">$main_point</div>
    <div class="takeaway" data-fit="28">$supporting_copy</div>
  </div>
</main>
<div class="handle"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 28c-5-3-8-8-8-13 4 1 7 4 8 7 1-3 4-6 8-7 0 5-3 10-8 13z"/><path d="M17 28c-2-5-2-11 0-17 2 6 2 12 0 17z"/></svg>$footer</div>
<script>
  // Shrink long copy until it fits inside the text area.
  const copy = document.querySelector(".copy");
  const fitted = [...document.querySelectorAll("[data-fit]")];
  for (let step = 0; step < 80 && copy.scrollHeight > copy.clientHeight; step++) {
    let changed = false;
    for (const element of fitted) {
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > Number(element.dataset.fit)) {
        element.style.fontSize = (size - 2) + "px";
        changed = true;
      }
    }
    if (!changed) break;
  }
  document.body.dataset.overflow = String(copy.scrollHeight > copy.clientHeight);
</script>
</body>
</html>
