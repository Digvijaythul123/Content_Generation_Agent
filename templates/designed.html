<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Illustrated designs already carry their words: show the whole picture,
     never cropped, over a soft blurred copy of itself if the shape differs. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  html { background: transparent; }
  body { background: $background; }
  .fill, .main { position: absolute; inset: 0; }
  .fill .art {
    width: 100%; height: 100%; object-fit: cover;
    filter: blur(40px) brightness(.85); transform: scale(1.15);
  }
  .main .art { width: 100%; height: 100%; object-fit: contain; }
  /* Reels: the payoff line the image tool left room for, faded in later. */
  .payoff {
    position: absolute; left: 90px; right: 130px; top: 1110px; height: 360px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    font-size: 66px; line-height: 1.2; font-style: italic; color: #F8ECD2;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .75), 0 0 4px rgba(0, 0, 0, .6);
  }
  .payoff::before {
    content: ""; position: absolute; inset: -60px -90px; z-index: -1;
    background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(10, 8, 6, .62), transparent 75%);
  }
  .payoff:has(.payoff-text:empty) { display: none; }
  .payoff .hl { color: #F5C542; font-weight: 700; }
  body.layer-background .payoff { display: none; }
  /* Veil: hides the answer already drawn in the art until it is revealed.
     It covers only the answer's band, with soft edges so it reads as part
     of the picture rather than a box. */
  .veil {
    display: none; position: absolute; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%);
  }
  .veil .art { position: absolute; object-fit: fill; }
  /* Mist: the line blurred away in the picture's own colours. */
  .reveal-mist .veil .art { filter: blur(32px) brightness(.92) saturate(.9); }
  /* Wipe: a strip of the page's own paper, slid off to uncover the line;
     its leading edge is soft too. */
  .reveal-wipe .veil {
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%),
      linear-gradient(90deg, transparent 0%, #000 6%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(180deg, transparent 0, #000 40px, #000 calc(100% - 40px), transparent 100%),
      linear-gradient(90deg, transparent 0%, #000 6%);
    mask-composite: intersect;
  }
  .reveal-wipe .veil .art { filter: blur(60px) brightness(1.02) saturate(.85); transform: scaleX(1.3); }
  /* Shadow: a dark band that lifts away. */
  .reveal-shadow .veil .art { filter: blur(28px) brightness(.4); }
  body.layer-veil { background: transparent; }
  body.layer-veil .fill, body.layer-veil .main, body.layer-veil .payoff { display: none; }
  body.layer-veil .veil { display: block; }
  body.layer-text { background: transparent; }
  body.layer-text .fill, body.layer-text .main { display: none; }
</style>
</head>
<body class="layer-$layer reveal-$reveal">
<div class="fill">$art</div>
<div class="main">$art</div>
<div class="veil">$art</div>
<div class="payoff" data-fit="34"><div class="payoff-text">$payoff</div></div>
<script>
  // Shrink a long payoff line until it fits its band.
  const payoff = document.querySelector(".payoff");
  for (let step = 0; step < 40 && payoff.scrollHeight > payoff.clientHeight; step++) {
    const size = parseFloat(getComputedStyle(payoff).fontSize);
    if (size <= Number(payoff.dataset.fit)) break;
    payoff.style.fontSize = (size - 2) + "px";
  }
  // Place the veil over the lower part of the picture (where answers are
  // drawn), matching the contained art exactly so the blur lines up. Runs
  // once the image has loaded, since its size is needed.
  const veil = document.querySelector(".veil");
  const veilArt = veil && veil.querySelector(".art");
  function placeVeil() {
    if (!veilArt || !veilArt.naturalWidth) return;
    const scale = Math.min(innerWidth / veilArt.naturalWidth, innerHeight / veilArt.naturalHeight);
    const w = veilArt.naturalWidth * scale, h = veilArt.naturalHeight * scale;
    const left = (innerWidth - w) / 2, top = (innerHeight - h) / 2;
    const from = $veil_from, to = $veil_to;  // share of the art's height to cover
    Object.assign(veil.style, { left: `$${left}px`, top: `$${top + h * from}px`,
      width: `$${w}px`, height: `$${h * (to - from)}px` });
    Object.assign(veilArt.style, { left: "0px", top: `$${-h * from}px`,
      width: `$${w}px`, height: `$${h}px` });
  }
  if (veilArt) {
    if (veilArt.complete) placeVeil();
    else veilArt.addEventListener("load", placeVeil);
  }
  document.body.dataset.overflow = "false";
</script>
</body>
</html>
