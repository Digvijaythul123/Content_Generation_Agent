<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Illustrated designs already carry their words: show the whole picture,
     never cropped, over a soft blurred copy of itself if the shape differs. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: $background; }
  .fill, .main { position: absolute; inset: 0; }
  .fill .art {
    width: 100%; height: 100%; object-fit: cover;
    filter: blur(40px) brightness(.85); transform: scale(1.15);
  }
  .main .art { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body class="layer-$layer">
<div class="fill">$art</div>
<div class="main">$art</div>
<script>document.body.dataset.overflow = "false";</script>
</body>
</html>
