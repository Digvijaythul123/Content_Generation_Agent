<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Illustrated designs already carry their words: show the whole picture,
     never cropped, over a soft blurred copy of itself if the shape differs. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: $background; }
  .fill, .main { position: absolute; inset: 0; }
  .fill .art {
    width: 100%; height: 100%; object-fit: cover;
    filter: blur(40px) brightness(.85); transform: scale(1.15);
  }
  .main .art { width: 100%; height: 100%; object-fit: contain; }
  /* Reels: the payoff line the image tool left room for, faded in later. */
  .payoff {
    position: absolute; left: 90px; right: 130px; top: 1110px; height: 360px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    font-size: 66px; line-height: 1.2; font-style: italic; color: #F8ECD2;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .75), 0 0 4px rgba(0, 0, 0, .6);
  }
  .payoff::before {
    content: ""; position: absolute; inset: -60px -90px; z-index: -1;
    background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(10, 8, 6, .62), transparent 75%);
  }
  .payoff:has(.payoff-text:empty) { display: none; }
  .payoff .hl { color: #F5C542; font-weight: 700; }
  body.layer-background .payoff { display: none; }
  body.layer-text { background: transparent; }
  body.layer-text .fill, body.layer-text .main { display: none; }
</style>
</head>
<body class="layer-$layer">
<div class="fill">$art</div>
<div class="main">$art</div>
<div class="payoff" data-fit="34"><div class="payoff-text">$payoff</div></div>
<script>
  // Shrink a long payoff line until it fits its band.
  const payoff = document.querySelector(".payoff");
  for (let step = 0; step < 40 && payoff.scrollHeight > payoff.clientHeight; step++) {
    const size = parseFloat(getComputedStyle(payoff).fontSize);
    if (size <= Number(payoff.dataset.fit)) break;
    payoff.style.fontSize = (size - 2) + "px";
  }
  document.body.dataset.overflow = "false";
</script>
</body>
</html>
