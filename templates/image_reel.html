<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: $background;
    color: $text;
    font-family: $font_family;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center top;
    /* Crop the bottom strip where image tools put their watermark. */
    transform: scale(1.11); transform-origin: center top;
  }
  /* Shades only the part of the painting behind the copy (the script
     sets where it starts), and never fully, so the art still shows. */
  .wash {
    position: absolute; left: 0; right: 0; bottom: 0; top: var(--wash-top, 55%);
    background: linear-gradient(180deg,
      transparent 0%, $background_rgba_soft 30%, $background_rgba_strong 70%,
      $background_rgba_strong 100%);
    opacity: .9;
  }
  /* Instagram's caption and buttons cover the bottom and right edges. */
  .column {
    position: absolute; left: 90px; right: 150px; bottom: 420px;
    top: 900px;
    display: flex; flex-direction: column; text-align: center;
  }
  .copy { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe flex-end; }
  .copy > * { flex-shrink: 0; }
  .copy, .handle { text-shadow: 0 2px 18px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .45); }
  .title {
    color: $accent; font-size: 50px; font-weight: 700; line-height: 1.2;
    margin-bottom: 34px; letter-spacing: .5px;
  }
  .quote { font-size: 54px; line-height: 1.34; margin-bottom: 34px; }
  .takeaway { color: $accent; font-size: 44px; font-weight: 700; line-height: 1.3; }
  .hl { color: $accent; font-weight: 700; }
  .handle { margin-top: 24px; font-size: 26px; opacity: .7; }

  /* Layers used for the video: the background moves, the text stays crisp. */
  body.layer-background .column { visibility: hidden; }
  /* "chrome": the glow and fades alone, laid over a motion clip. */
  body.layer-chrome { background: transparent; }
  body.layer-chrome .art { display: none; }
  body.layer-chrome .column, body.layer-chrome .handle { visibility: hidden; }
  body.layer-text { background: transparent; }
  body.layer-text .art, body.layer-text .wash { display: none; }
  /* One line per layer so the video can reveal them in sequence. */
  body.only-title .quote, body.only-title .takeaway, body.only-title .handle,
  body.only-quote .title, body.only-quote .takeaway, body.only-quote .handle,
  body.only-takeaway .title, body.only-takeaway .quote { visibility: hidden; }
</style>
</head>
<body class="layer-$layer">
$art
<div class="wash"></div>
<main class="column">
  <div class="copy">
    <div class="title" data-fit="34">$title</div>
    <div class="quote" data-fit="34">$main_point</div>
    <div class="takeaway" data-fit="30">$supporting_copy</div>
  </div>
  <div class="handle">$footer</div>
</main>
<script>
  // Shrink long copy until it fits inside the text column.
  const copy = document.querySelector(".copy");
  const fitted = [...document.querySelectorAll("[data-fit]")];
  for (let step = 0; step < 80 && copy.scrollHeight > copy.clientHeight; step++) {
    let changed = false;
    for (const element of fitted) {
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > Number(element.dataset.fit)) {
        element.style.fontSize = (size - 2) + "px";
        changed = true;
      }
    }
    if (!changed) break;
  }
  document.body.dataset.overflow = String(copy.scrollHeight > copy.clientHeight);
  // Start the shade a little above the first line of copy.
  const first = copy.firstElementChild.getBoundingClientRect().top;
  document.body.style.setProperty("--wash-top", Math.max(0, first - 260) + "px");
</script>
</body>
</html>
