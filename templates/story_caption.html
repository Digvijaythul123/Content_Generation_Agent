<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One caption of a story video: cream words on a soft dark shade, over
     moving footage. The title sits at the top during the first shot; shot
     captions sit in the lower middle, above Instagram's caption area. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body {
    position: relative; color: #FFF6E6;
    font-family: Didot, "Bodoni 72", "Playfair Display", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .shade {
    position: absolute; left: 0; right: 0; height: 520px;
    background: radial-gradient(ellipse 85% 50% at 50% 50%,
      rgba(10, 8, 6, .5) 0%, rgba(10, 8, 6, .22) 55%, transparent 80%);
  }
  .box {
    position: absolute; left: 100px; right: 100px; height: 340px;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .text {
    font-size: 64px; line-height: 1.22;
    text-shadow: 0 2px 20px rgba(0, 0, 0, .85), 0 0 4px rgba(0, 0, 0, .7);
  }
  .text .hl { color: #F5C542; font-weight: 700; }
  body.title .box { top: 230px; }
  body.title .shade { top: 140px; }
  body.title .text { font-size: 76px; font-weight: 600; }
  body.caption .box { top: 1060px; }
  body.caption .shade { top: 970px; }
  body.caption .text { font-style: italic; }
</style>
</head>
<body class="$kind">
<div class="shade"></div>
<div class="box" data-fit="40"><div class="text">$text</div></div>
<script>
  // Shrink a long line until it fits its box.
  const box = document.querySelector(".box");
  const text = document.querySelector(".text");
  for (let step = 0; step < 40 && box.scrollHeight > box.clientHeight; step++) {
    const size = parseFloat(getComputedStyle(text).fontSize);
    if (size <= Number(box.dataset.fit)) break;
    text.style.fontSize = (size - 2) + "px";
  }
  document.body.dataset.overflow = String(box.scrollHeight > box.clientHeight);
</script>
</body>
</html>
