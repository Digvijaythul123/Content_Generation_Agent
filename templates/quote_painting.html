<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: $background;
    color: $text;
    font-family: $font_family;
    -webkit-font-smoothing: antialiased;
  }
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: right center;
  }
  /* Keeps the copy readable even where the painting spills left. */
  .wash {
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      $background_rgba_strong 0%, $background_rgba_strong 42%,
      $background_rgba_soft 62%, transparent 78%);
  }
  .column {
    position: absolute; top: 0; bottom: 0; left: 0; width: 640px;
    padding: 120px 40px 80px 76px;
    display: flex; flex-direction: column; text-align: center;
  }
  .copy { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; }
  .copy > * { flex-shrink: 0; }
  .title {
    color: $accent; font-size: 44px; font-weight: 700; line-height: 1.25;
    margin-bottom: 56px;
  }
  .quote { font-size: 54px; line-height: 1.38; margin-bottom: 52px; }
  .takeaway { color: $accent; font-size: 42px; font-weight: 700; line-height: 1.35; }
  .hl { color: $accent; font-weight: 700; }
  .handle { margin-top: 36px; font-size: 24px; opacity: .7; }
</style>
</head>
<body>
$art
<div class="wash"></div>
<main class="column">
  <div class="copy">
    <div class="title" data-fit="30">$title</div>
    <div class="quote" data-fit="30">$main_point</div>
    <div class="takeaway" data-fit="26">$supporting_copy</div>
  </div>
  <div class="handle">$handle</div>
</main>
<script>
  // Shrink long copy until it fits inside the text column.
  const copy = document.querySelector(".copy");
  const fitted = [...document.querySelectorAll("[data-fit]")];
  for (let step = 0; step < 80 && copy.scrollHeight > copy.clientHeight; step++) {
    let changed = false;
    for (const element of fitted) {
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > Number(element.dataset.fit)) {
        element.style.fontSize = (size - 2) + "px";
        changed = true;
      }
    }
    if (!changed) break;
  }
  document.body.dataset.overflow = String(copy.scrollHeight > copy.clientHeight);
</script>
</body>
</html>
