<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Correlation isn't causation</title>
  <desc id="description">Rain can explain why umbrellas and wet streets appear together.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#202a32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c17c"/>
      <stop offset="1" stop-color="#d78a45"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#e9b36e"/>
    </marker>
  </defs>

  <rect width="1080" height="1350" fill="url(#background)"/>
  <circle cx="1000" cy="140" r="260" fill="#e6a85b" opacity=".035"/>
  <circle cx="0" cy="1040" r="340" fill="#6d91a0" opacity=".045"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="104" fill="#f3c17c" font-size="20" font-weight="700" letter-spacing="4">RATIONAL THOUGHTS</text>
    <text x="988" y="104" fill="#9da8b0" font-size="17" text-anchor="end" letter-spacing="2">02</text>
    <path d="M92 132h896" stroke="#ffffff" stroke-opacity=".18"/>

    <text x="92" y="220" fill="#e9b36e" font-size="18" font-weight="700" letter-spacing="4">A CLASSIC REASONING TRAP</text>

    <text x="88" y="344" fill="#f4f1e9" font-size="82" font-weight="700" letter-spacing="-3">Correlation</text>
    <text x="88" y="443" fill="#f4f1e9" font-size="82" font-weight="700" letter-spacing="-3">isn't</text>
    <text x="88" y="542" fill="#f3c17c" font-size="82" font-weight="700" letter-spacing="-3">causation.</text>

    <rect x="92" y="620" width="896" height="362" rx="24" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="132" y="674" fill="#aeb8bf" font-size="16" font-weight="700" letter-spacing="3">A SIMPLE EXAMPLE</text>

    <path d="M540 787C470 820 365 834 318 880" fill="none" stroke="#e9b36e" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M540 787C610 820 715 834 762 880" fill="none" stroke="#e9b36e" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(474 706)">
      <path d="M25 58c-19 0-29-12-29-27 0-14 11-25 25-27 7-19 25-31 46-29 17 2 30 13 35 29 16 1 28 13 28 28 0 15-12 26-29 26z" fill="#26343e" stroke="#e9b36e" stroke-width="2.5"/>
    </g>
    <text x="540" y="750" fill="#f4f1e9" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="2">RAIN</text>

    <rect x="151" y="884" width="334" height="70" rx="14" fill="#18232c" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="595" y="884" width="334" height="70" rx="14" fill="#18232c" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="318" y="929" fill="#d7dce0" font-size="22" font-weight="600" text-anchor="middle">MORE UMBRELLAS</text>
    <text x="762" y="929" fill="#d7dce0" font-size="22" font-weight="600" text-anchor="middle">WETTER STREETS</text>

    <text x="92" y="1062" fill="#d7dce0" font-size="28">Rain can explain why both happen together.</text>
    <path d="M92 1110h104" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="92" y="1183" fill="#f3c17c" font-size="28" font-weight="700">Ask what else could explain the pattern.</text>

    <text x="92" y="1272" fill="#9da8b0" font-size="17" letter-spacing="2">NOTICE THE LINK. TEST THE CAUSE.</text>
  </g>
</svg>
