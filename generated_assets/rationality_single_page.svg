<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">A confident opinion isn't evidence</title>
  <desc id="description">A Rational Thoughts editorial post asking what evidence would change your mind.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#202a32"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="27%" r="58%">
      <stop offset="0" stop-color="#e6a85b" stop-opacity=".17"/>
      <stop offset="1" stop-color="#e6a85b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c17c"/>
      <stop offset="1" stop-color="#d78a45"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#background)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>

  <g fill="none" stroke="#f3c17c" stroke-opacity=".12">
    <circle cx="866" cy="340" r="238" stroke-width="1.5"/>
    <circle cx="866" cy="340" r="187" stroke-width="1.5"/>
    <circle cx="866" cy="340" r="134" stroke-width="1.5"/>
    <path d="M620 340h492M866 94v492" stroke-width="1"/>
    <path d="M694 168l344 344M1038 168 694 512" stroke-width="1"/>
  </g>
  <circle cx="866" cy="340" r="8" fill="#f3c17c" fill-opacity=".8"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="104" fill="#f3c17c" font-size="20" font-weight="700" letter-spacing="4">RATIONAL THOUGHTS</text>
    <path d="M92 132h896" stroke="#ffffff" stroke-opacity=".18"/>

    <text x="92" y="270" fill="#e9b36e" font-size="18" font-weight="700" letter-spacing="5">A QUESTION WORTH ASKING</text>

    <text x="88" y="447" fill="#f4f1e9" font-size="88" font-weight="700" letter-spacing="-3">A confident</text>
    <text x="88" y="555" fill="#f4f1e9" font-size="88" font-weight="700" letter-spacing="-3">opinion</text>
    <text x="88" y="663" fill="#f4f1e9" font-size="88" font-weight="700" letter-spacing="-3">isn't</text>
    <text x="88" y="771" fill="#f3c17c" font-size="88" font-weight="700" letter-spacing="-3">evidence.</text>

    <path d="M92 832h104" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

    <text x="92" y="928" fill="#d7dce0" font-size="34" font-weight="400">What evidence would</text>
    <text x="92" y="978" fill="#d7dce0" font-size="34" font-weight="400">change your mind?</text>

    <g transform="translate(92 1120)">
      <circle cx="20" cy="20" r="20" fill="none" stroke="#e9b36e" stroke-width="2"/>
      <path d="M20 8v12l9 6" fill="none" stroke="#e9b36e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="27" fill="#aeb8bf" font-size="18" font-weight="600" letter-spacing="2">PAUSE. QUESTION. THINK.</text>
    </g>

    <text x="92" y="1270" fill="#9da8b0" font-size="17" letter-spacing="2">CRITICAL THINKING STARTS WITH CURIOSITY.</text>
    <text x="988" y="1270" fill="#9da8b0" font-size="17" text-anchor="end">01</text>
  </g>
</svg>
